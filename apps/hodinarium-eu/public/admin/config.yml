# Sveltia CMS — konfigurace editoru pro Hodinárium.
#
# Auth gating: Cloudflare Access (Google OAuth) chrání /admin/* PŘED touto stránkou.
# Commit identity: cshbot (přes csh-cms-proxy Worker s GitHub PAT).
# Frontmatter `author:` field drží reálnou identitu editora (vyplňuje sám).
#
# Schema mirror obsahových polí z apps/hodinarium-eu/src/content.config.ts.
# Drift mezi config.yml a content.config.ts = build failne (Zod refine) —
# tj. config.yml MUSÍ jít aktualizovat při změně Zod schématu.

backend:
  name: github
  repo: csh-cz/web
  branch: main
  # Pages Function proxy URL — same-origin s /admin/, eliminuje cross-origin
  # CORS+CF Access cookie problém co měl samostatný Worker.
  # Pages Function za stejnou Access app jako /admin/ → cookie auto, žádný CORS.
  api_root: 'https://hodinarium-eu.pages.dev/api/cms'
  base_url: 'https://hodinarium-eu.pages.dev/api/cms'

# Editorial workflow: direct push (Save = commit do main = za 90s live).
# PR-based workflow by editory zatahoval do GitHub UI, čemuž se vyhýbáme.
publish_mode: simple

# Foto cesty — drag-drop fotky se ukládají do public/img/<collection>/<slug>/
media_folder: 'apps/hodinarium-eu/public/img'
public_folder: '/img'

site_url: 'https://hodinarium-eu.pages.dev'
display_url: 'https://hodinarium-eu.pages.dev'
# logo_url: záměrně NEnastaveno — Sveltia by jinak ukazovala CSH logo v
# horní liště editoru jako "go to site" element, což editorův odchod
# matlalo s běžnou navigací. Místo loga používáme explicitní floating
# button "← Zpět na web" v admin/index.html (vlevo nahoře).

# === Společné typy referencí (žijí v references[] napříč collections) ===
# YAML anchor pro znovupoužití
_reference_fields: &reference_fields
  - { name: title, label: 'Název', widget: string, required: true }
  - { name: url, label: 'URL', widget: string, required: false, hint: 'Volitelný odkaz' }
  - { name: author, label: 'Autor', widget: string, required: false }
  - { name: year, label: 'Rok', widget: string, required: false, hint: 'Číslo nebo text' }
  - name: type
    label: 'Typ'
    widget: select
    required: false
    default: odkaz
    options: [kniha, clanek, pdf, odkaz, wiki, mapa]
  - { name: note, label: 'Poznámka', widget: text, required: false }

collections:
  # ── 1) Články (sbirka/konstrukce/projekty/virtualni-muzeum/muzea/zajimavosti) ──
  - name: clanky
    label: 'Články'
    label_singular: 'Článek'
    folder: 'content/hodinarium-eu'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{category}})'
    # Filter — vyloučit evidenční karty (mají vlastní collection níže).
    # Sveltia podporuje filter na poli; karta má podsekce: 'karta'.
    filter: { field: podsekce, value: karta, equals: false }
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true, hint: 'lowercase, bez diakritiky, oddělovač pomlčka' }
      - name: category
        label: 'Kategorie'
        widget: select
        required: true
        options:
          - { label: 'Sbírka', value: sbirka }
          - { label: 'Konstrukce', value: konstrukce }
          - { label: 'Projekty', value: projekty }
          - { label: 'Virtuální muzeum', value: virtualni-muzeum }
          - { label: 'Muzea', value: muzea }
          - { label: 'Zajímavosti', value: zajimavosti }
      - { name: tldr, label: 'Stručně (perex)', widget: text, required: false, hint: '1–2 věty pro rámeček nad článkem. Ne kopie 1. odstavce.' }
      - { name: author, label: 'Autor článku', widget: string, required: false, hint: 'Tvoje jméno (např. „Petr Král"). Zobrazí se v patičce jako „P. Král".' }
      - name: tags
        label: 'Tagy'
        widget: list
        required: false
        hint: 'Whitelist v src/data/tags.json — typo failne build.'
        field: { name: tag, label: 'Tag', widget: string }
      - name: references
        label: 'Reference / odkazy'
        widget: list
        required: false
        fields: *reference_fields
      - name: referenceStyle
        label: 'Styl seznamu referencí'
        widget: select
        required: false
        default: bullet
        options: [bullet, numbered]
      - { name: ogImage, label: 'OG obrázek (override)', widget: image, required: false, hint: 'Default = /og/<slug>.png; vlastní cesta /img/...' }
      - { name: thumbnail, label: 'Thumbnail (atlas/katalog)', widget: image, required: false }
      - name: relatedKarty
        label: 'Související evidenční karty'
        widget: list
        required: false
        hint: 'Slugy karet (inv-NNN-*) — proklik na /sbirka/karta/<slug>.'
        field: { name: slug, label: 'Slug karty', widget: string }
      - { name: manualEdit, label: 'Manual edit flag', widget: boolean, required: false, default: true }
      # Hidden / auto fields (CMS je needituje, ale uchovává)
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - { name: body, label: 'Tělo článku', widget: markdown }

  # ── 2) Evidenční karty sbírky (podsekce: karta) ──
  - name: karty
    label: 'Sbírka — evidenční karty'
    label_singular: 'Karta'
    folder: 'content/hodinarium-eu'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false  # mazání karet jen ručně přes git
    slug: 'inv-{{fields.karta.inventarniCislo}}-{{slug}}'
    identifier_field: title
    summary: '{{title}} (inv. č. {{karta.inventarniCislo}})'
    filter: { field: podsekce, value: karta }
    fields:
      - { name: title, label: 'Nadpis karty', widget: string, required: true,
          hint: 'Krátký název exponátu, např. „Věžní hodiny od Prokeše, Veselí n. Lužnicí, 1868". Zobrazí se v záhlaví detailu karty.' }
      - { name: slug, label: 'URL část (slug)', widget: string, required: true,
          hint: 'Krátký identifikátor pro web — jen malá písmena bez háčků, oddělovač pomlčka. Např. „vezni-prokes-1868". Pokud nevíš, zeptej se.' }
      - { name: category, label: 'Kategorie', widget: hidden, default: sbirka }
      - { name: podsekce, label: 'Podsekce', widget: hidden, default: karta }
      # Strukturovaná data karty exponátu.
      # Pořadí polí logicky odpovídá: identifikace → konstrukce → spolková
      # evidence → historie. Nested objekty zůstávají flat (žádná migrace
      # 290 .md souborů zatím), pole jen přeskupena pro lepší UX v editoru.
      - name: karta
        label: 'Údaje o exponátu'
        widget: object
        required: true
        fields:
          # ─── 1. Identifikace exponátu ───
          - { name: inventarniCislo, label: 'Inventární číslo', widget: string, required: true,
              hint: 'Pořadové číslo v evidenci spolku (1–999, nebo „x1"–„x99" pro rozšířenou evidenci). Nesmí být prázdné.' }
          - { name: datace, label: 'Datace (rok výroby)', widget: string, required: false,
              hint: 'Rok výroby nebo období. Klidně přibližně: „1868" / „polovina 18. století" / „1868–1872". Pokud nevíš, nech prázdné.' }
          - name: vyrobce
            label: 'Výrobce / hodinář'
            widget: relation
            collection: hodinari
            search_fields: [title, slug]
            value_field: title
            display_fields: [title, mesto]
            required: false
            multiple: false
            hint: 'Vyber ze seznamu hodinářů. Pokud výrobce v seznamu chybí, dej vědět Davidovi a doplníme medailon (stub) — pak ho můžeš přiřadit. Můžeš nechat prázdné.'
          - { name: signatura, label: 'Signatura výrobce', widget: string, required: false,
              hint: 'Štítek nebo podpis výrobce na hodinách. Opiš přesně tak, jak je tam napsáno (i s diakritikou nebo zkratkami).' }

          # ─── 2. Jak je to vyrobené (konstrukce) ───
          - name: ram
            label: 'Materiál rámu'
            widget: select
            required: false
            options: [kovaný, litinový, ocelový, dřevěný, mosazný, jiné]
            hint: 'Z čeho je rám stroje. Pokud kombinace, vyber převažující materiál a popiš v poli „Adaptace" níže.'
          - name: krokJicihoStroje
            label: 'Krok jicího stroje (escapement)'
            widget: select
            required: false
            options:
              - vřetenový krok
              - kotvový krok
              - lihýřový krok
              - Grahamův krok
              - Amantův kolíčkový krok
              - 'kolíčkový krok Benoita a Roberta de Sancerre'
              - Hippův přerušovač
              - jiné
            hint: 'Mechanismus, který odměřuje čas. Pokud znáš, vyber. Pokud ne nebo to není v seznamu, nech prázdné nebo vyber „jiné".'
          - name: biciStroje
            label: 'Bicí stroje (co odbíjí)'
            widget: select
            required: false
            multiple: true
            options: [hodinové, půlové, čtvrťové, repetiční, žádné]
            hint: 'Co exponát odbíjí. Můžeš vybrat víc najednou (např. „čtvrťové" + „hodinové" = oboje).'
          - { name: kyvadlo, label: 'Kyvadlo (typ a délka)', widget: string, required: false,
              hint: 'Např. „~90 cm" nebo „rtuťové kompenzační". Pokud bez kyvadla, nech prázdné.' }
          - { name: ciselnik, label: 'Ciferník', widget: string, required: false,
              hint: 'Popis ciferníku — průměr, materiál, číslice, autor. Např. „smaltovaný 35 cm, římské číslice".' }
          - name: pohon
            label: 'Typ pohonu'
            widget: select
            required: false
            options:
              - závaží
              - péro
              - 'elektrický (motor)'
              - elektromagnetický
              - ruční natahování
              - jiné
            hint: 'Hlavní princip pohonu. Pokud detail nesedí, vyber „jiné" a popiš v poli „Detail pohonu" níže.'
          - { name: pohonDetail, label: 'Detail pohonu (volitelně)', widget: string, required: false,
              hint: 'Volitelné upřesnění, pokud „jiné" nebo si chceš poznamenat detail. Např. „elektromagnetické natahování závaží (uzavřený Huyghensův řetězec)".' }
          - { name: rozmery, label: 'Rozměry exponátu', widget: string, required: false,
              hint: 'Rozměry hodin/stroje, formát „šířka × výška × hloubka v cm". Např. „45×60×30 cm". Pokud nevíš, nech prázdné.' }

          # ─── 3. Kde je teď a komu patří ───
          - name: umisteni
            label: 'Současné umístění v Hodináriu'
            widget: select
            required: false
            options:
              - 'Sál Věžní'
              - 'Sál Věžní — Vitrína 1'
              - 'Sál Věžní — Vitrína 2'
              - 'Sál Věžní — Vitrína 3'
              - 'Sál Elektro'
              - 'Sál Elektro — Panel 1'
              - 'Sál Elektro — Panel 2'
              - 'Sál Elektro — Panel 3'
              - 'Sál Elektro — Panel 4'
              - 'Sál Elektro — Panel 5'
              - 'Sál Elektro — Vitrína 1'
              - 'Sál Elektro — Vitrína 2'
              - 'Sál Elektro — Vitrína 3'
              - 'Sál Elektro — Vitrína 4'
              - 'Sál Elektro — Vitrína rohová'
              - 'Sklad / depozitář'
              - 'Mimo Hodinárium (zápůjčka, restaurování, …)'
            hint: 'Vyber kde teď exponát fyzicky stojí. „Sál Věžní" / „Sál Elektro" samostatně = na podlaze sálu (mimo vitríny/panely). Pokud na novém místě, řekni Davidovi a doplníme možnost.'
          - { name: majitel, label: 'Majitel', widget: string, required: false,
              hint: 'Kdo exponát vlastní. Většinou „Spolek" (Český spolek horologický), občas konkrétní osoba (např. „Baudisch") nebo instituce (např. „Arcibiskupství pražské"). Pokud nevíš, nech prázdné.' }
          - { name: darceZapujcitel, label: 'Dárce / zapůjčitel', widget: string, required: false,
              hint: 'Od koho jsme exponát dostali (často ≠ majitel). Pokud darem nebo dlouhodobou zápůjčkou, doplň. Jinak nech prázdné.' }
          - name: vztahKeSbirce
            label: 'Vztah ke sbírce'
            widget: select
            required: false
            default: spolek
            options:
              - { label: 'Vlastní (spolkový)',                   value: spolek }
              - { label: 'Dar',                                  value: dar }
              - { label: 'Koupě',                                value: koupě }
              - { label: 'Zápůjčka',                             value: zápůjčka }
              - { label: 'Montáž (cizí, jen instalujeme)',       value: montáž }
            hint: 'Jak exponát přišel do sbírky. „Spolek" = patří přímo nám.'
          - name: pridanoDoSbirky
            label: 'Rok přírůstku do sbírky'
            widget: number
            required: false
            value_type: int
            min: 2009
            max: 2030
            hint: 'Rok kdy spolek exponát získal (mezi 2009 a aktuálním rokem). Pokud nevíš, nech prázdné.'
          - name: stav
            label: 'Stav exponátu'
            widget: select
            required: false
            default: funkční
            options:
              - { label: 'Funkční (chodí)',                      value: funkční }
              - { label: 'Nefunkční (nechodí)',                  value: nefunkční }
              - { label: 'Částečně funkční',                     value: 'částečně funkční' }
              - { label: 'Restauruje se',                        value: 'restauruje se' }

          # ─── 4. Historie exponátu (volitelné) ───
          - name: puvodniUmisteni
            label: 'Původní umístění (před zařazením do sbírky)'
            widget: object
            required: false
            collapsed: true
            hint: 'Kde hodiny stávaly dřív, před tím než přišly do Hodinária. Volitelné.'
            fields:
              - { name: objekt, label: 'Objekt', widget: string, required: false,
                  hint: 'Název budovy/místa, např. „kostel sv. Jakuba", „radnice", „továrna Škoda".' }
              - name: typObjektu
                label: 'Typ objektu'
                widget: select
                required: false
                options: [kostel, radnice, zámek, továrna, klášter, škola, 'soukromý dům', vlakové nádraží, jiné]
                hint: 'Pokud typ není v seznamu, vyber „jiné".'
              - { name: obec, label: 'Obec', widget: string, required: false,
                  hint: 'Město nebo vesnice, kde objekt stojí/stál. Např. „Kutná Hora".' }
              - { name: detail, label: 'Detail umístění', widget: string, required: false,
                  hint: 'Volitelný detail — např. „věž — jižní strana", „hlavní vchod".' }
          - { name: restaurovani, label: 'Restaurování', widget: text, required: false,
              hint: 'Kdo, kdy a co opravoval. Stačí věta — např. „V roce 2015 Pepa Novák vyměnil pero a vyčistil mechanismus."' }
          - { name: adaptaceProVystavu, label: 'Adaptace pro vystavení', widget: text, required: false,
              hint: 'Co bylo upraveno aby se exponát dal vystavit (úprava pohonu, snížení rychlosti, výměna ciferníku za repliku, …).' }

          # ─── 5. Pokročilé (komplety, vlastní atributy) ───
          - name: komponenty
            label: 'Komponenty kompletu'
            widget: list
            required: false
            collapsed: true
            hint: 'Pokud karta reprezentuje soubor (např. hodinový + bicí + zvonící stroj), zde slugy souvisejících článků/sub-karet (např. „inv-142-bici-stroj"). Pokud samostatný exponát, nech prázdné.'
            field: { name: slug, label: 'Slug podkarty / článku', widget: string }
          - name: extra
            label: 'Vlastní atributy (label + hodnota)'
            widget: list
            required: false
            collapsed: true
            hint: 'Pro speciální atributy co nejsou v formuláři. Vlevo název pole, vpravo hodnota. Např. „Hmotnost" / „120 kg". Většinou nepotřebné.'
            fields:
              - { name: label, label: 'Název pole', widget: string }
              - { name: value, label: 'Hodnota', widget: string }
      - name: tags
        label: 'Tagy'
        widget: list
        required: false
        hint: 'Klíčová slova pro vyhledávání. Whitelist v src/data/tags.json — typo failne build. Pokud nevíš, nech prázdné nebo se zeptej.'
        field: { name: tag, label: 'Tag', widget: string }
      - { name: author, label: 'Autor karty', widget: string, required: false,
          hint: 'Tvoje jméno (např. „Petr Král"). Zobrazí se v patičce karty jako „P. Král".' }
      - { name: manualEdit, label: 'Ručně editováno (do diff zachovat změny)', widget: boolean, required: false, default: true }
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - { name: body, label: 'Volitelný popisný text', widget: markdown, required: false,
          hint: 'Volný text pod strukturovanými údaji. Můžeš sem napsat příběh exponátu, fotografie, kontext. Markdown formátování.' }

  # ── 3) Kronika (chronologický feed) ──
  - name: kronika
    label: 'Kronika'
    label_singular: 'Kronikový záznam'
    folder: 'content/kronika'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug', widget: string, required: true }
      - { name: date, label: 'Datum (ISO YYYY-MM-DD)', widget: string, required: true, hint: 'Plné datum nebo rozsah „2015-09-04 — 2015-09-06"' }
      - { name: rok, label: 'Rok (pro chronologii)', widget: number, required: true, value_type: int, min: 2009, max: 2030 }
      - name: typ
        label: 'Typ záznamu'
        widget: select
        required: false
        options: [vernisaz, fotoreport, sezona, akvizice, tisk, tv, restaurace, historie-spolku, tematicka-vystava, jine]
      - { name: misto, label: 'Místo', widget: string, required: false }
      - { name: author, label: 'Autor záznamu', widget: string, required: false }
      - name: related
        label: 'Související exponáty / hodináři'
        widget: list
        required: false
        fields:
          - { name: slug, label: 'Slug', widget: string }
          - name: kategorie
            label: 'Kategorie'
            widget: select
            required: false
            options: [sbirka, konstrukce, projekty, virtualni-muzeum, muzea, zajimavosti, hodinari]
      - name: photos
        label: 'Fotky (cesty)'
        widget: list
        required: false
        field: { name: path, label: 'Cesta', widget: string }
      - name: references
        label: 'Reference'
        widget: list
        required: false
        fields: *reference_fields
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: body, label: 'Tělo záznamu', widget: markdown }

  # ── 4) Hodináři (medailony osob a firem) ──
  - name: hodinari
    label: 'Hodináři (medailony)'
    label_singular: 'Medailon'
    folder: 'content/hodinari'
    extension: mdx
    format: yaml-frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{typ}}, {{mesto}})'
    fields:
      - { name: title, label: 'Jméno / firma', widget: string, required: true }
      - { name: slug, label: 'Slug', widget: string, required: true, hint: 'lowercase-s-pomlckami' }
      - name: typ
        label: 'Typ'
        widget: select
        required: true
        options: [osoba, firma]
      - { name: obdobi, label: 'Životní data / působení', widget: string, required: false, hint: '„1869–1955" / „akt. ~1880–1920"' }
      - { name: mesto, label: 'Město', widget: string, required: false }
      - { name: zeme, label: 'Země (ISO 3166)', widget: string, required: false, default: 'CZ' }
      - name: aliasy
        label: 'Aliasy / varianty jména'
        widget: list
        required: false
        field: { name: alias, label: 'Alias', widget: string }
      - { name: shrnuti, label: 'Shrnutí (1–3 věty)', widget: text, required: true, hint: 'Plain text — markdown linky se nerenderují, jen text.' }
      - { name: portret, label: 'Portrét (cesta)', widget: image, required: false }
      - { name: portretCredit, label: 'Atribuce portrétu', widget: string, required: false, hint: 'Autor + licence (např. „Wikimedia, CC BY-SA 3.0")' }
      - { name: portretSource, label: 'Zdroj portrétu (URL)', widget: string, required: false }
      - name: references
        label: 'Reference'
        widget: list
        required: false
        fields: *reference_fields
      - { name: body, label: 'Plný text medailonu', widget: markdown, required: false, hint: 'MDX — můžeš použít komponenty jako <Photo>.' }

  # ── 5) Spolkové stránky (horologie-cz) ──
  # Statické stránky webu Českého spolku horologického — kontakt, novinky,
  # spolek, stanovy, zápisy, usnesení. Nikoli Akce (žijí v src/data/akce.ts
  # — vyžaduje migraci na content collection v separátní session).
  - name: horologie-clanky
    label: 'Spolek (horologie-cz)'
    label_singular: 'Spolková stránka'
    folder: 'content/horologie-cz'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true }
      - { name: category, label: 'Kategorie (volitelná)', widget: string, required: false }
      - { name: manualEdit, label: 'Manual edit flag', widget: boolean, required: false, default: true }
      # Hidden — pro legacy import compatibility
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - { name: body, label: 'Tělo stránky', widget: markdown }
