# Sveltia CMS — konfigurace editoru pro Hodinárium.
#
# Auth gating: Cloudflare Access (Google OAuth) chrání /admin/* PŘED touto stránkou.
# Commit identity: cshbot (přes csh-cms-proxy Worker s GitHub PAT).
# Frontmatter `author:` field drží reálnou identitu editora (vyplňuje sám).
#
# Schema mirror obsahových polí z apps/hodinarium-eu/src/content.config.ts.
# Drift mezi config.yml a content.config.ts = build failne (Zod refine) —
# tj. config.yml MUSÍ jít aktualizovat při změně Zod schématu.

backend:
  name: github
  repo: csh-cz/web
  branch: main
  # Pages Function proxy URL — same-origin s /admin/, eliminuje cross-origin
  # CORS+CF Access cookie problém co měl samostatný Worker.
  # Pages Function za stejnou Access app jako /admin/ → cookie auto, žádný CORS.
  api_root: 'https://hodinarium-eu.pages.dev/api/cms'
  base_url: 'https://hodinarium-eu.pages.dev/api/cms'

# Editorial workflow: direct push (Save = commit do main = za 90s live).
# PR-based workflow by editory zatahoval do GitHub UI, čemuž se vyhýbáme.
publish_mode: simple

# Foto cesty — drag-drop fotky se ukládají do public/img/<collection>/<slug>/
media_folder: 'apps/hodinarium-eu/public/img'
public_folder: '/img'

site_url: 'https://hodinarium-eu.pages.dev'
display_url: 'https://hodinarium-eu.pages.dev'
# logo_url: záměrně NEnastaveno — Sveltia by jinak ukazovala CSH logo v
# horní liště editoru jako "go to site" element, což editorův odchod
# matlalo s běžnou navigací. Místo loga používáme explicitní floating
# button "← Zpět na web" v admin/index.html (vlevo nahoře).

# === Společné typy referencí (žijí v references[] napříč collections) ===
# YAML anchor pro znovupoužití
_editor_notes_field: &editor_notes_field
  name: editorNotes
  label: 'Editorské poznámky (interní)'
  widget: list
  required: false
  hint: 'Viditelné jen po přihlášení editora. TODO, varování o nejistotě, kontext k článku.'
  fields:
    - { name: level, label: 'Úroveň', widget: select, options: [info, warn, todo], default: info }
    - { name: title, label: 'Titulek (volitelný)', widget: string, required: false }
    - { name: text, label: 'Text', widget: text, required: true }
    - { name: noteKey, label: 'Klíč (pro resolve)', widget: string, required: false, hint: 'Volitelný identifikátor: hellich-stub, manual-edit-false, hodinar-stub, …' }

# Editorial workflow — viz docs/design-editor-workflow-2026-05-10.md
# a /admin/handbook/. Status čte úkolovník (/admin/tasks/) — non-ready
# články se tam zobrazí. Pole je opt-in (default = ready, neviditelné v
# úkolovníku). Lock je advisory; viz handbook.
_workflow_field: &workflow_field
  name: workflow
  label: 'Workflow status (volitelné, pro úkolovník)'
  widget: object
  required: false
  collapsed: true
  hint: 'Když je status != ready, článek se objeví v /admin/tasks/. Default ready = mimo úkolovník.'
  fields:
    - name: status
      label: 'Stav'
      widget: select
      required: false
      default: ready
      options:
        - { label: 'Hotovo (publikováno)', value: ready }
        - { label: 'K zabrání (todo)', value: todo }
        - { label: 'Rozpracováno', value: in-progress }
        - { label: 'K recenzi', value: review }
    - { name: lockedBy, label: 'Zabráno editorem (GitHub username)', widget: string, required: false, hint: 'Volitelné. Advisory zámek — domluvte se.' }
    - { name: lockedAt, label: 'Zabráno kdy (ISO datum)', widget: datetime, required: false, format: 'YYYY-MM-DDTHH:mm:ssZ', date_format: 'YYYY-MM-DD', time_format: 'HH:mm' }
    - name: reviewers
      label: 'Reviewers (GitHub usernames)'
      widget: list
      required: false
      field: { name: username, label: 'Username', widget: string }
    - name: reviewedBy
      label: 'Schválili (GitHub usernames)'
      widget: list
      required: false
      field: { name: username, label: 'Username', widget: string }
    - { name: publicDuringEdit, label: 'Veřejnost vidí během editace?', widget: boolean, required: false, default: false, hint: 'Default OFF = non-ready článek je 404 pro veřejnost. Zapni jen u článků, které mají být live i během rozpracovanosti.' }
    - { name: notes, label: 'Poznámky k workflow', widget: text, required: false }

_reference_fields: &reference_fields
  - { name: title, label: 'Název', widget: string, required: true }
  - { name: url, label: 'URL', widget: string, required: false, hint: 'Volitelný odkaz' }
  - { name: author, label: 'Autor', widget: string, required: false }
  - { name: year, label: 'Rok', widget: string, required: false, hint: 'Číslo nebo text' }
  - name: type
    label: 'Typ'
    widget: select
    required: false
    default: odkaz
    options: [kniha, clanek, pdf, odkaz, wiki, mapa]
  - { name: note, label: 'Poznámka', widget: text, required: false }

# Reference field set pro slovník — má strukturu odlišnou od ostatních collections
# (žádný url/author/year/type, ale verbatim `citace` z primárního pramene).
# Schema mirror: slovnikReference v src/content.config.ts.
_slovnik_reference_fields: &slovnik_reference_fields
  - { name: bibKey, label: 'Zotero bibKey', widget: string, required: false, hint: 'Citation-key z Zotera (Better BibTeX), např. "buresHodinoveStroje1965". Renderuje ISO 690 přes citeproc.' }
  - { name: title, label: 'Název (ad-hoc, bez bibKey)', widget: string, required: false }
  - { name: citace, label: 'Citace (doslovný úryvek)', widget: text, required: false, hint: 'Verbatim quote z pramene, renderuje se v blockquote.' }
  - { name: pages, label: 'Stránky', widget: string, required: false, hint: 'Override stránek pro citaci, např. „97" nebo „97–101".' }
  - { name: note, label: 'Poznámka', widget: text, required: false }

collections:
  # ── 1) Články (sbirka/konstrukce/projekty/virtualni-muzeum/muzea/zajimavosti) ──
  - name: clanky
    label: 'Články'
    label_singular: 'Článek'
    folder: 'content/hodinarium-eu'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{category}})'
    # Filter — vyloučit evidenční karty (mají vlastní collection níže).
    # Sveltia/Decap filter syntax: `pattern` (regex) je dokumentovaná,
    # `equals: false` je experimentální → použijeme regex negation.
    # Match: cokoliv KROMĚ "karta" (incl. missing podsekce field = "").
    filter:
      field: podsekce
      pattern: '^(?!karta$).*$'
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true, hint: 'lowercase, bez diakritiky, oddělovač pomlčka' }
      - name: category
        label: 'Kategorie'
        widget: select
        required: true
        options:
          - { label: 'Sbírka', value: sbirka }
          - { label: 'Konstrukce', value: konstrukce }
          - { label: 'Projekty', value: projekty }
          - { label: 'Virtuální muzeum', value: virtualni-muzeum }
          - { label: 'Muzea', value: muzea }
          - { label: 'Zajímavosti', value: zajimavosti }
      - { name: tldr, label: 'Stručně (perex)', widget: text, required: false, hint: '1–2 věty pro rámeček nad článkem. Ne kopie 1. odstavce.' }
      - { name: author, label: 'Autor článku', widget: string, required: false, hint: 'Tvoje jméno (např. „Petr Král"). Zobrazí se v patičce jako „P. Král".' }
      - name: tags
        label: 'Tagy'
        widget: list
        required: false
        hint: 'Whitelist v src/data/tags.json — typo failne build.'
        field: { name: tag, label: 'Tag', widget: string }
      - name: searchKeywords
        label: 'Klíčová slova (skrytá, jen pro vyhledávání)'
        widget: list
        required: false
        hint: 'Synonyma, alternativní pravopisy a cizí termíny pro full-text search. NEzobrazí se na stránce. Příklady: „lihýř", „foliot", „Maresch", „Bychory".'
        field: { name: keyword, label: 'Keyword', widget: string }
      - name: references
        label: 'Reference / odkazy'
        widget: list
        required: false
        fields: *reference_fields
      - name: referenceStyle
        label: 'Styl seznamu referencí'
        widget: select
        required: false
        default: bullet
        options: [bullet, numbered]
      - <<: *editor_notes_field
      - <<: *workflow_field
      - { name: ogImage, label: 'OG obrázek (override)', widget: image, required: false, hint: 'Default = /og/<slug>.png; vlastní cesta /img/...' }
      - { name: thumbnail, label: 'Thumbnail (atlas/katalog)', widget: image, required: false }
      - name: relatedKarty
        label: 'Související evidenční karty'
        widget: list
        required: false
        hint: 'Slugy karet (inv-NNN-*) — proklik na /sbirka/karta/<slug>.'
        field: { name: slug, label: 'Slug karty', widget: string }
      - { name: manualEdit, label: 'Manual edit flag', widget: boolean, required: false, default: true }
      # Hidden / auto fields (CMS je needituje, ale uchovává)
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - { name: body, label: 'Tělo článku', widget: markdown }

  # ── 2) Evidenční karty sbírky (podsekce: karta) ──
  - name: karty
    label: 'Sbírka — evidenční karty'
    label_singular: 'Karta'
    folder: 'content/hodinarium-eu'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false  # mazání karet jen ručně přes git
    slug: 'inv-{{fields.karta.inventarniCislo}}-{{slug}}'
    identifier_field: title
    summary: '{{title}} (inv. č. {{karta.inventarniCislo}})'
    # Filter — jen entries s podsekce: karta. Pattern syntax (dokumentovaná)
    # místo plain value, kvůli konzistenci s clanky filter.
    filter:
      field: podsekce
      pattern: '^karta$'
    fields:
      - { name: title, label: 'Nadpis karty', widget: string, required: true,
          hint: 'Krátký název exponátu, např. „Věžní hodiny od Prokeše, Veselí n. Lužnicí, 1868". Zobrazí se v záhlaví detailu karty.' }
      - { name: slug, label: 'URL část (slug)', widget: string, required: true,
          hint: 'Krátký identifikátor pro web — jen malá písmena bez háčků, oddělovač pomlčka. Např. „vezni-prokes-1868". Pokud nevíš, zeptej se.' }
      - { name: category, label: 'Kategorie', widget: hidden, default: sbirka }
      - { name: podsekce, label: 'Podsekce', widget: hidden, default: karta }
      # Strukturovaná data karty exponátu.
      # Pořadí polí logicky odpovídá: identifikace → konstrukce → spolková
      # evidence → historie. Nested objekty zůstávají flat (žádná migrace
      # 290 .md souborů zatím), pole jen přeskupena pro lepší UX v editoru.
      - name: karta
        label: 'Údaje o exponátu'
        widget: object
        required: true
        fields:
          # ─── 1. Identifikace exponátu ───
          - { name: inventarniCislo, label: 'Inventární číslo', widget: string, required: true,
              hint: 'Pořadové číslo v evidenci spolku (1–999, nebo „x1"–„x99" pro rozšířenou evidenci). Nesmí být prázdné.' }
          - { name: datace, label: 'Datace (rok výroby)', widget: string, required: false,
              hint: 'Rok výroby nebo období. Klidně přibližně: „1868" / „polovina 18. století" / „1868–1872". Pokud nevíš, nech prázdné.' }
          - name: vyrobce
            label: 'Výrobce / hodinář'
            widget: relation
            collection: hodinari
            search_fields: [title, slug]
            value_field: title
            display_fields: [title, mesto]
            required: false
            multiple: false
            hint: 'Vyber ze seznamu hodinářů. Pokud výrobce v seznamu chybí, dej vědět Davidovi a doplníme medailon (stub) — pak ho můžeš přiřadit. Můžeš nechat prázdné.'
          - { name: signatura, label: 'Signatura výrobce', widget: string, required: false,
              hint: 'Štítek nebo podpis výrobce na hodinách. Opiš přesně tak, jak je tam napsáno (i s diakritikou nebo zkratkami).' }

          # ─── 2. Jak je to vyrobené (konstrukce) ───
          - name: ram
            label: 'Materiál rámu'
            widget: select
            required: false
            options: [kovaný, litinový, ocelový, dřevěný, mosazný, jiné]
            hint: 'Z čeho je rám stroje. Pokud kombinace, vyber převažující materiál a popiš v poli „Adaptace" níže.'
          - name: krokJicihoStroje
            label: 'Krok jicího stroje (escapement)'
            widget: select
            required: false
            options:
              - vřetenový krok
              - kotvový krok
              - lihýřový krok
              - Grahamův krok
              - Amantův kolíčkový krok
              - 'kolíčkový krok Benoita a Roberta de Sancerre'
              - Hippův přerušovač
              - jiné
            hint: 'Mechanismus, který odměřuje čas. Pokud znáš, vyber. Pokud ne nebo to není v seznamu, nech prázdné nebo vyber „jiné".'
          - name: biciStroje
            label: 'Bicí stroje (co odbíjí)'
            widget: select
            required: false
            multiple: true
            options: [hodinové, půlové, čtvrťové, repetiční, žádné]
            hint: 'Co exponát odbíjí. Můžeš vybrat víc najednou (např. „čtvrťové" + „hodinové" = oboje).'
          - { name: kyvadlo, label: 'Kyvadlo (typ a délka)', widget: string, required: false,
              hint: 'Např. „~90 cm" nebo „rtuťové kompenzační". Pokud bez kyvadla, nech prázdné.' }
          - { name: ciselnik, label: 'Ciferník', widget: string, required: false,
              hint: 'Popis ciferníku — průměr, materiál, číslice, autor. Např. „smaltovaný 35 cm, římské číslice".' }
          - name: pohon
            label: 'Typ pohonu'
            widget: select
            required: false
            options:
              - závaží
              - péro
              - 'elektrický (motor)'
              - elektromagnetický
              - ruční natahování
              - jiné
            hint: 'Hlavní princip pohonu. Pokud detail nesedí, vyber „jiné" a popiš v poli „Detail pohonu" níže.'
          - { name: pohonDetail, label: 'Detail pohonu (volitelně)', widget: string, required: false,
              hint: 'Volitelné upřesnění, pokud „jiné" nebo si chceš poznamenat detail. Např. „elektromagnetické natahování závaží (uzavřený Huyghensův řetězec)".' }
          - { name: rozmery, label: 'Rozměry exponátu', widget: string, required: false,
              hint: 'Rozměry hodin/stroje, formát „šířka × výška × hloubka v cm". Např. „45×60×30 cm". Pokud nevíš, nech prázdné.' }

          # ─── 3. Kde je teď a komu patří ───
          - name: umisteni
            label: 'Současné umístění v Hodináriu'
            widget: select
            required: false
            options:
              - 'Sál Věžní'
              - 'Sál Věžní — Vitrína 1'
              - 'Sál Věžní — Vitrína 2'
              - 'Sál Věžní — Vitrína 3'
              - 'Sál Elektro'
              - 'Sál Elektro — Panel 1'
              - 'Sál Elektro — Panel 2'
              - 'Sál Elektro — Panel 3'
              - 'Sál Elektro — Panel 4'
              - 'Sál Elektro — Panel 5'
              - 'Sál Elektro — Vitrína 1'
              - 'Sál Elektro — Vitrína 2'
              - 'Sál Elektro — Vitrína 3'
              - 'Sál Elektro — Vitrína 4'
              - 'Sál Elektro — Vitrína rohová'
              - 'Sklad / depozitář'
              - 'Mimo Hodinárium (zápůjčka, restaurování, …)'
            hint: 'Vyber kde teď exponát fyzicky stojí. „Sál Věžní" / „Sál Elektro" samostatně = na podlaze sálu (mimo vitríny/panely). Pokud na novém místě, řekni Davidovi a doplníme možnost.'
          - { name: majitel, label: 'Majitel', widget: string, required: false,
              hint: 'Kdo exponát vlastní. Většinou „Spolek" (Český spolek horologický), občas konkrétní osoba (např. „Baudisch") nebo instituce (např. „Arcibiskupství pražské"). Pokud nevíš, nech prázdné.' }
          - { name: darceZapujcitel, label: 'Dárce / zapůjčitel', widget: string, required: false,
              hint: 'Od koho jsme exponát dostali (často ≠ majitel). Pokud darem nebo dlouhodobou zápůjčkou, doplň. Jinak nech prázdné.' }
          - name: vztahKeSbirce
            label: 'Vztah ke sbírce'
            widget: select
            required: false
            default: spolek
            options:
              - { label: 'Vlastní (spolkový)',                   value: spolek }
              - { label: 'Dar',                                  value: dar }
              - { label: 'Koupě',                                value: koupě }
              - { label: 'Zápůjčka',                             value: zápůjčka }
              - { label: 'Montáž (cizí, jen instalujeme)',       value: montáž }
            hint: 'Jak exponát přišel do sbírky. „Spolek" = patří přímo nám.'
          - name: pridanoDoSbirky
            label: 'Rok přírůstku do sbírky'
            widget: number
            required: false
            value_type: int
            min: 2009
            max: 2030
            hint: 'Rok kdy spolek exponát získal (mezi 2009 a aktuálním rokem). Pokud nevíš, nech prázdné.'
          - name: stav
            label: 'Stav exponátu'
            widget: select
            required: false
            default: funkční
            options:
              - { label: 'Funkční (chodí)',                      value: funkční }
              - { label: 'Nefunkční (nechodí)',                  value: nefunkční }
              - { label: 'Částečně funkční',                     value: 'částečně funkční' }
              - { label: 'Restauruje se',                        value: 'restauruje se' }

          # ─── 4. Historie exponátu (volitelné) ───
          - name: puvodniUmisteni
            label: 'Původní umístění (před zařazením do sbírky)'
            widget: object
            required: false
            collapsed: true
            hint: 'Kde hodiny stávaly dřív, před tím než přišly do Hodinária. Volitelné.'
            fields:
              - { name: objekt, label: 'Objekt', widget: string, required: false,
                  hint: 'Název budovy/místa, např. „kostel sv. Jakuba", „radnice", „továrna Škoda".' }
              - name: typObjektu
                label: 'Typ objektu'
                widget: select
                required: false
                options: [kostel, radnice, zámek, továrna, klášter, škola, 'soukromý dům', vlakové nádraží, jiné]
                hint: 'Pokud typ není v seznamu, vyber „jiné".'
              - { name: obec, label: 'Obec', widget: string, required: false,
                  hint: 'Město nebo vesnice, kde objekt stojí/stál. Např. „Kutná Hora".' }
              - { name: detail, label: 'Detail umístění', widget: string, required: false,
                  hint: 'Volitelný detail — např. „věž — jižní strana", „hlavní vchod".' }
          - { name: restaurovani, label: 'Restaurování', widget: text, required: false,
              hint: 'Kdo, kdy a co opravoval. Stačí věta — např. „V roce 2015 Pepa Novák vyměnil pero a vyčistil mechanismus."' }
          - { name: adaptaceProVystavu, label: 'Adaptace pro vystavení', widget: text, required: false,
              hint: 'Co bylo upraveno aby se exponát dal vystavit (úprava pohonu, snížení rychlosti, výměna ciferníku za repliku, …).' }

          # ─── 5. Pokročilé (komplety, vlastní atributy) ───
          - name: komponenty
            label: 'Komponenty kompletu'
            widget: list
            required: false
            collapsed: true
            hint: 'Pokud karta reprezentuje soubor (např. hodinový + bicí + zvonící stroj), zde slugy souvisejících článků/sub-karet (např. „inv-142-bici-stroj"). Pokud samostatný exponát, nech prázdné.'
            field: { name: slug, label: 'Slug podkarty / článku', widget: string }
          - name: extra
            label: 'Vlastní atributy (label + hodnota)'
            widget: list
            required: false
            collapsed: true
            hint: 'Pro speciální atributy co nejsou v formuláři. Vlevo název pole, vpravo hodnota. Např. „Hmotnost" / „120 kg". Většinou nepotřebné.'
            fields:
              - { name: label, label: 'Název pole', widget: string }
              - { name: value, label: 'Hodnota', widget: string }
      - name: tags
        label: 'Tagy'
        widget: list
        required: false
        hint: 'Klíčová slova pro vyhledávání. Whitelist v src/data/tags.json — typo failne build. Pokud nevíš, nech prázdné nebo se zeptej.'
        field: { name: tag, label: 'Tag', widget: string }
      - name: searchKeywords
        label: 'Klíčová slova (skrytá, jen pro vyhledávání)'
        widget: list
        required: false
        hint: 'Synonyma, alternativní pravopisy a cizí termíny pro full-text search. NEzobrazí se na stránce. Příklady: „lihýř", „foliot", „Maresch", „Bychory".'
        field: { name: keyword, label: 'Keyword', widget: string }
      - { name: author, label: 'Autor karty', widget: string, required: false,
          hint: 'Tvoje jméno (např. „Petr Král"). Zobrazí se v patičce karty jako „P. Král".' }
      - { name: manualEdit, label: 'Ručně editováno (do diff zachovat změny)', widget: boolean, required: false, default: true }
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - <<: *workflow_field
      - { name: body, label: 'Volitelný popisný text', widget: markdown, required: false,
          hint: 'Volný text pod strukturovanými údaji. Můžeš sem napsat příběh exponátu, fotografie, kontext. Markdown formátování.' }

  # ── 3) Kronika (chronologický feed) ──
  - name: kronika
    label: 'Kronika'
    label_singular: 'Kronikový záznam'
    folder: 'content/kronika'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug', widget: string, required: true }
      - { name: date, label: 'Datum (ISO YYYY-MM-DD)', widget: string, required: true, hint: 'Plné datum nebo rozsah „2015-09-04 — 2015-09-06"' }
      - { name: rok, label: 'Rok (pro chronologii)', widget: number, required: true, value_type: int, min: 2009, max: 2030 }
      - name: typ
        label: 'Typ záznamu'
        widget: select
        required: false
        options: [vernisaz, fotoreport, sezona, akvizice, tisk, tv, restaurace, historie-spolku, tematicka-vystava, jine]
      - { name: misto, label: 'Místo', widget: string, required: false }
      - { name: author, label: 'Autor záznamu', widget: string, required: false }
      - name: related
        label: 'Související exponáty / hodináři'
        widget: list
        required: false
        fields:
          - { name: slug, label: 'Slug', widget: string }
          - name: kategorie
            label: 'Kategorie'
            widget: select
            required: false
            options: [sbirka, konstrukce, projekty, virtualni-muzeum, muzea, zajimavosti, hodinari]
      - name: photos
        label: 'Fotky (cesty)'
        widget: list
        required: false
        field: { name: path, label: 'Cesta', widget: string }
      - name: references
        label: 'Reference'
        widget: list
        required: false
        fields: *reference_fields
      - <<: *editor_notes_field
      - <<: *workflow_field
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: body, label: 'Tělo záznamu', widget: markdown }

  # ── 4) Hodináři (medailony osob a firem) ──
  - name: hodinari
    label: 'Hodináři (medailony)'
    label_singular: 'Medailon'
    folder: 'content/hodinari'
    extension: mdx
    format: yaml-frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{typ}}, {{mesto}})'
    fields:
      - { name: title, label: 'Jméno / firma', widget: string, required: true }
      - { name: slug, label: 'Slug', widget: string, required: true, hint: 'lowercase-s-pomlckami' }
      - name: typ
        label: 'Typ'
        widget: select
        required: true
        options: [osoba, firma]
      - { name: obdobi, label: 'Životní data / působení', widget: string, required: false, hint: '„1869–1955" / „akt. ~1880–1920"' }
      - { name: mesto, label: 'Město', widget: string, required: false }
      - { name: zeme, label: 'Země (ISO 3166)', widget: string, required: false, default: 'CZ' }
      - name: aliasy
        label: 'Aliasy / varianty jména'
        widget: list
        required: false
        field: { name: alias, label: 'Alias', widget: string }
      - { name: shrnuti, label: 'Shrnutí (1–3 věty)', widget: text, required: true, hint: 'Plain text — markdown linky se nerenderují, jen text.' }
      - { name: portret, label: 'Portrét (cesta)', widget: image, required: false }
      - { name: portretCredit, label: 'Atribuce portrétu', widget: string, required: false, hint: 'Autor + licence (např. „Wikimedia, CC BY-SA 3.0")' }
      - { name: portretSource, label: 'Zdroj portrétu (URL)', widget: string, required: false }
      - name: references
        label: 'Reference'
        widget: list
        required: false
        fields: *reference_fields
      - <<: *editor_notes_field
      - <<: *workflow_field
      - { name: body, label: 'Plný text medailonu', widget: markdown, required: false, hint: 'MDX — můžeš použít komponenty jako <Photo>.' }

  # ── 5) Soupis věžních hodin ──
  # 396 záznamů věžních hodin ČR (a okolních zemí) — primárně z primárních
  # pramenů (tabulky Krečmer, Landesberger; Hellichův seznam 1880; NPÚ
  # Památkový katalog; Wikidata; OSM). Každý záznam = jedna lokace +
  # technické údaje + historie. Schema definováno v src/content.config.ts.
  - name: soupis-veznich-hodin
    label: 'Soupis věžních hodin'
    label_singular: 'Záznam soupisu'
    folder: 'content/soupis-veznich-hodin'
    extension: mdx
    format: yaml-frontmatter
    create: true
    delete: false
    identifier_field: slug
    summary: '{{rok}} — {{puvodniMisto.obec}} ({{puvodniMisto.budova}})'
    fields:
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true,
          hint: 'Stabilní identifikátor, typicky <rok>-<misto>-<hodinar>. Např. „1868-bychory-prokes". Lowercase, bez diakritiky, oddělovač pomlčka.' }
      - { name: rok, label: 'Rok výroby', widget: string, required: true,
          hint: 'Číslo („1868") nebo rozsah („1850–1855") nebo odhadované („po 1880"). Neznámý = „?".' }
      - name: hodinar
        label: 'Hodinář (slug medailionu)'
        widget: relation
        collection: hodinari
        search_fields: [title, slug]
        value_field: slug
        display_fields: [title]
        required: false
        multiple: false
        hint: 'Vyber ze seznamu hodinářů. Pokud chybí, použij volný text níže.'
      - { name: hodinarText, label: 'Hodinář (volný text)', widget: string, required: false,
          hint: 'Když hodinář nemá medailon. Např. „připisováno Prokešovi" / „anonymní".' }

      # ─── Lokace ───
      - name: puvodniMisto
        label: 'Původní místo'
        widget: object
        required: true
        fields:
          - { name: obec, label: 'Obec', widget: string, required: true }
          - { name: cast, label: 'Městská část / čtvrť', widget: string, required: false }
          - { name: budova, label: 'Budova (kostel, radnice, zámek…)', widget: string, required: false }
          - { name: okres, label: 'Okres', widget: string, required: false }
          - { name: kraj, label: 'Kraj', widget: string, required: false }
          - { name: zeme, label: 'Země (ISO kód)', widget: string, default: 'CZ', required: false }

      - name: souradnice
        label: 'Souřadnice [lat, lon] WGS84'
        widget: list
        required: false
        field: { name: hodnota, label: 'Číslo', widget: number, value_type: float, step: 0.000001 }
        min: 2
        max: 2
        hint: 'Dvě desetinná čísla — zeměpisná šířka a délka.'
      - { name: souradnicePribl, label: 'Souřadnice jen přibližné (úroveň obce)', widget: boolean, default: false, required: false }

      # ─── Stav + chod + přenos ───
      - name: stav
        label: 'Stav hodin'
        widget: select
        default: neznamy
        options:
          - { label: 'In situ (na původním místě)', value: in_situ }
          - { label: 'Přeneseno jinam', value: preneseno }
          - { label: 'Ztracené', value: ztracene }
          - { label: 'Zničené', value: znicene }
          - { label: 'Neznámý', value: neznamy }
      - name: chod
        label: 'Aktuální chod'
        widget: select
        required: false
        options:
          - { label: 'V chodu', value: v_chodu }
          - { label: 'Nefunkční', value: nefunkcni }
          - { label: 'Restaurováno', value: restaurovano }
          - { label: 'Před restaurováním', value: pred_restaurovanim }
          - { label: 'Zničené', value: znicene }
          - { label: 'Neznámý', value: neznamy }
      - name: prenos
        label: 'Přenos (pokud bylo přeneseno)'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: do, label: 'Kam', widget: string, required: true, hint: '"Hodinárium Děčín" / "NTM Praha" / "soukr. sbírka, Švýcarsko"' }
          - { name: rok, label: 'Rok přenosu', widget: string, required: false }
          - { name: poznamka, label: 'Poznámka', widget: text, required: false }

      # ─── Technické údaje ───
      - { name: krok, label: 'Krok', widget: string, required: false,
          hint: '"graham" / "denison" / "4-leg-denison" / "amant-lepaut" / "kotvovy" / „špindlový" / …' }
      - { name: pohon, label: 'Pohon', widget: string, required: false,
          hint: '"zavazi" / "pero" / "elektricky" / …' }
      - { name: pocetCifernik, label: 'Počet ciferníků', widget: number, value_type: int, required: false }
      - { name: rozmery, label: 'Rozměry', widget: string, required: false, hint: '„ráfek 1200 mm" / „stroj 800 × 600 × 400 mm"' }
      - { name: signatura, label: 'Signatura výrobce', widget: string, required: false }
      - { name: cenaDobova, label: 'Dobová cena', widget: string, required: false, hint: '„900 zl." / „1125 K"' }

      # ─── Restaurování ───
      - { name: restaurator, label: 'Restaurátor', widget: string, required: false }
      - { name: rokRestaurovani, label: 'Rok restaurování', widget: string, required: false }

      # ─── Foto ───
      - name: foto
        label: 'Fotografie'
        widget: list
        required: false
        collapsed: true
        fields:
          - { name: src, label: 'Cesta k fotografii', widget: image, required: true }
          - { name: alt, label: 'Popis (alt)', widget: string, required: false }
          - { name: credit, label: 'Credit (autor, licence, zdroj)', widget: string, required: false }
          - name: typ
            label: 'Typ záběru'
            widget: select
            required: false
            options: [stroj, budova, cifernik, detail, historicke, plan, jine]

      # ─── Prameny / literatura ───
      - name: prameny
        label: 'Prameny a literatura'
        widget: list
        required: false
        collapsed: true
        fields:
          - { name: bibKey, label: 'Zotero bibKey (preferred)', widget: string, required: false,
              hint: 'Citation-key ze Zotera. Když vyplníš, ostatní fields ignorovány — citace se generuje přes citeproc.' }
          - { name: title, label: 'Titul (legacy)', widget: string, required: false }
          - { name: url, label: 'URL', widget: string, required: false }
          - { name: citace, label: 'Plná ISO 690 citace', widget: text, required: false }
          - { name: autor, label: 'Autor', widget: string, required: false }
          - { name: rok, label: 'Rok', widget: string, required: false }
          - name: type
            label: 'Typ'
            widget: select
            required: false
            options: [kniha, clanek, pdf, odkaz, wiki, mapa, patent, archiv, zprava]
          - { name: pages, label: 'Stránky', widget: string, required: false }
          - { name: poznamka, label: 'Poznámka', widget: text, required: false }

      # ─── Cross-refs ───
      - name: relatedKarty
        label: 'Související karty sbírky'
        widget: list
        required: false
        field: { name: slug, label: 'Slug karty (inv-NNN-…)', widget: string }
      - name: relatedClanky
        label: 'Související články'
        widget: list
        required: false
        field: { name: slug, label: 'Slug článku', widget: string }

      # ─── Externí identifikátory ───
      - { name: osmId, label: 'OSM ID', widget: string, required: false, hint: 'např. „way/123456789"' }
      - { name: wikidataId, label: 'Wikidata Qid', widget: string, required: false, hint: 'např. „Q12345"' }
      - name: pamatkovyKatalog
        label: 'Památkový katalog NPÚ'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: id, label: 'NPÚ ID (numerický identifikátor v URL)', widget: string, required: true }
          - { name: slug, label: 'NPÚ slug (slugovaná část URL)', widget: string, required: false }
          - { name: npuKatCislo, label: 'NPÚ KatCislo', widget: string, required: false }

      # ─── Meta ───
      - { name: isStub, label: 'Stub (neúplný záznam, čeká na doplnění)', widget: boolean, default: false, required: false }
      - { name: poznamka, label: 'Volný text (poznámka)', widget: text, required: false }
      - { name: posledniOvereni, label: 'Poslední ověření (datum)', widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: zdrojDat, label: 'Zdroj dat', widget: string, required: false, hint: '„tabulka_krecmer" / „tabulka_landesbergerove" / „manual" / „osm-import"' }

      - <<: *editor_notes_field
      - <<: *workflow_field
      - { name: body, label: 'Volný text záznamu (MDX)', widget: markdown, required: false,
          hint: 'Volitelný delší narativ. Můžeš použít direktivy (::photo, ::pdf-pager) a markdown formátování.' }

  # ── 6) Spolkové stránky (horologie-cz) ──
  # Statické stránky webu Českého spolku horologického — kontakt, novinky,
  # spolek, stanovy, zápisy, usnesení. Nikoli Akce (žijí v src/data/akce.ts
  # — vyžaduje migraci na content collection v separátní session).
  - name: horologie-clanky
    label: 'Spolek (horologie-cz)'
    label_singular: 'Spolková stránka'
    folder: 'content/horologie-cz'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: title, label: 'Nadpis', widget: string, required: true }
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true }
      - { name: category, label: 'Kategorie (volitelná)', widget: string, required: false }
      - { name: manualEdit, label: 'Manual edit flag', widget: boolean, required: false, default: true }
      # Hidden — pro legacy import compatibility
      - { name: originalUrl, label: 'Original URL', widget: hidden }
      - { name: lastModified, label: 'Last modified', widget: hidden }
      - { name: sourceCharset, label: 'Source charset', widget: hidden, default: 'utf-8' }
      - { name: scrapedAt, label: 'Scraped at', widget: hidden }
      - <<: *workflow_field
      - { name: body, label: 'Tělo stránky', widget: markdown }

  # ── 7) Slovník (hodinářská terminologie) ──
  # 153 hesel z primárních pramenů (Šumavský 1851, Špatný 1882, Sušický 1900,
  # Sladkovský 1947, Bureš 1965, Saunier 1887, Gros 1913, Dietzschold 1894).
  # Strukturované překlady DE/EN/FR, varianty (status badge), polysémní
  # významy, atestace napříč prameny, conceptId pro cross-lingual lookup.
  # Schema definováno v src/content.config.ts (slovnik collection).
  - name: slovnik
    label: 'Slovník (hodinářská terminologie)'
    label_singular: 'Heslo slovníku'
    folder: 'content/slovnik'
    extension: md
    format: yaml-frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} ({{kategorie}})'
    fields:
      - { name: title, label: 'Heslo (cs)', widget: string, required: true, hint: 'Lowercase typicky: „krok", „kotva". U vlastních jmen kapitálka.' }
      - { name: slug, label: 'Slug (URL část)', widget: string, required: true, hint: 'lowercase-s-pomlckami, např. „kolo-zaverkove"' }
      - name: kategorie
        label: 'Kategorie'
        widget: select
        required: true
        options:
          - { label: 'Mechanika (krok, soukolí, kyvadlo, setrvačka)', value: mechanika }
          - { label: 'Bicí mechanismy (kladívko, cymbál, početník)', value: bici }
          - { label: 'Astronomické a sluneční (gnómon, časová rovnice)', value: astronomicke }
          - { label: 'Materiály (invar, rubínový kámen)', value: materialy }
          - { label: 'Hodinky (kalibr, korunka, chronograf)', value: hodinky }
          - { label: 'Profese a školy', value: profese }
          - { label: 'Jiné', value: jine }
      - { name: definice, label: 'Definice (1–2 věty)', widget: text, required: true, hint: 'Markdown podporován pro [odkaz](/slovnik/x). Pro polysémní hesla použij `vyznamy[]` níže.' }
      - name: conceptId
        label: 'Concept ID (volitelné)'
        widget: string
        required: false
        pattern: ['^HORO-[A-Z]+-\d{3}$', 'Formát: HORO-TOPIC-NNN (např. HORO-DIAL-001)']
        hint: 'Stabilní identifikátor konceptu napříč jazyky (např. HORO-ESCAPEMENT-001 pro krok / escapement / Hemmung).'
      - name: redirectTo
        label: 'Přesměrovat na heslo (slug)'
        widget: string
        required: false
        hint: 'Pokud je vyplněno, jde o alias (např. „cifernik" → „ciselnik"). Banner „→ Viz X" se vyrenderuje před body.'
      - { name: isStub, label: 'Stub (neúplné heslo, čeká na doplnění)', widget: boolean, required: false, default: false }

      # ── Varianty (česky) ──
      - name: varianty
        label: 'Varianty cs (alternativní tvary, archaismy, dialekty)'
        widget: list
        required: false
        hint: 'Pro každou variantu uveď status (preferred/admitted/archaic/erroneous/historical). Legacy plain stringy ve frontmatteru zůstávají funkční.'
        fields:
          - { name: term, label: 'Tvar', widget: string, required: true }
          - name: status
            label: 'Status'
            widget: select
            required: true
            default: admitted
            options:
              - { label: 'Preferred — moderní cs odborný úzus', value: preferred }
              - { label: 'Admitted — přípustný (anglicismus, neformální)', value: admitted }
              - { label: 'Archaic — historický (19. stol., dnes neužitý)', value: archaic }
              - { label: 'Erroneous — lidový / chybný', value: erroneous }
              - { label: 'OCR-variant — artefakt OCR/HTR', value: 'ocr-variant' }
              - { label: 'Historical — doloženo, ne hodnotící', value: historical }
          - { name: note, label: 'Poznámka', widget: string, required: false }
          - { name: 'doloženo', label: 'Doloženo (pramen)', widget: string, required: false, hint: 'Např. „Špatný 1882, s. 23"' }

      # ── Překlady ──
      - name: prekladyDe
        label: 'Překlady DE'
        widget: list
        required: false
        fields:
          - { name: term, label: 'DE termín', widget: string, required: true }
          - name: genus
            label: 'Rod'
            widget: select
            required: false
            options: ['', m, f, n, mf, pl]
            default: ''
          - { name: deklinace, label: 'Deklinace', widget: string, required: false, hint: 'gen.sg., nom.pl. nebo zkrácená forma „-(e)s, -e"' }
          - { name: zdroj, label: 'Zdroj (např. „Špatný 1882")', widget: string, required: false }
      - name: prekladyEn
        label: 'Překlady EN'
        widget: list
        required: false
        fields:
          - { name: term, label: 'EN termín', widget: string, required: true }
          - { name: zdroj, label: 'Zdroj', widget: string, required: false }
      - name: prekladyFr
        label: 'Překlady FR'
        widget: list
        required: false
        fields:
          - { name: term, label: 'FR termín', widget: string, required: true }
          - name: genus
            label: 'Rod'
            widget: select
            required: false
            options: ['', m, f, n, mf, pl]
            default: ''
          - { name: zdroj, label: 'Zdroj', widget: string, required: false }

      # ── Polysémní významy ──
      - name: vyznamy
        label: 'Polysémní významy (jen pokud heslo má více významů)'
        widget: list
        required: false
        hint: 'Většina hesel má jen jednu definici (pole výše). Použij jen pro hesla s rozlišitelnými významy podle kontextu (např. „ručka").'
        fields:
          - { name: kontext, label: 'Kontext', widget: string, required: true, hint: 'Např. „v hodinařině", „v astronomii", „obecně"' }
          - { name: definice, label: 'Definice', widget: text, required: true }
          - name: kategorie
            label: 'Kategorie (override default)'
            widget: select
            required: false
            options: ['', mechanika, bici, astronomicke, materialy, hodinky, profese, jine]
            default: ''
          - name: prameny
            label: 'Prameny (bibKeys nebo slugy)'
            widget: list
            required: false
            field: { name: pramen, label: 'BibKey / slug', widget: string }
          - { name: odkaz, label: 'Externí odkaz (URL)', widget: string, required: false }

      # ── Atestace (terminologická proměna napříč prameny) ──
      - name: atestace
        label: 'Atestace (terminologické proměny napříč prameny)'
        widget: list
        required: false
        hint: 'Jen pro hesla s prokazatelnou terminologickou proměnou (cca 10–15 hesel, např. rafije → ručka). Většina hesel toto nevyžaduje.'
        fields:
          - { name: rok, label: 'Rok', widget: string, required: true, hint: 'Číslo nebo text „kolem 1900"' }
          - { name: pramen, label: 'Pramen (krátký label)', widget: string, required: true, hint: 'Např. „Špatný" / „Sušický" / „Sladkovský"' }
          - { name: forma, label: 'Forma slova v tomto prameni', widget: string, required: true }
          - { name: citace, label: 'Doslovný úryvek', widget: text, required: false }
          - { name: note, label: 'Komentář', widget: string, required: false }
          - { name: bibKey, label: 'Zotero bibKey (volitelný)', widget: string, required: false }

      # ── Příbuzné termíny ──
      - name: pribuzne
        label: 'Příbuzné slugy (cross-links)'
        widget: list
        required: false
        hint: 'Slugy dalších hesel slovníku (např. „kotva", „palety", „krokove-kolo").'
        field: { name: slug, label: 'Slug', widget: string }

      # ── References s doslovnými citacemi ──
      - name: references
        label: 'Reference (doslovné citace z pramenů)'
        widget: list
        required: false
        fields: *slovnik_reference_fields

      # ── Hero obrázek ──
      - name: obrazek
        label: 'Hero obrázek (volitelný)'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: src, label: 'Cesta', widget: image, required: true }
          - { name: alt, label: 'Alt text', widget: string, required: true }
