<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hodinárium — administrace</title>
  </head>
  <body>
    <!--
      Sveltia CMS — drop-in editor pro content collections.
      Auth gating řeší Cloudflare Access (Google OAuth) PŘED touto stránkou,
      takže k UI se dostane jen někdo na allow-list.
      Skutečné committy do GitHubu jdou přes csh-cms-proxy Worker, který
      drží GitHub PAT bota cshbot.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Po načtení Sveltia auto-klik „Sign In with GitHub" — aby editor
      // (Petr / Baudisch) neviděl login screen vůbec. Worker /auth endpoint
      // se zachová jako OAuth proxy, ale tichý (CF Access JWT → token).
      (function autoLogin() {
        var attempts = 0;
        var maxAttempts = 40;  // ~10 s
        var timer = setInterval(function () {
          attempts++;
          if (attempts > maxAttempts) {
            clearInterval(timer);
            return;
          }
          // Hledej tlačítko „Sign In with GitHub" — Sveltia render
          var buttons = document.querySelectorAll('button');
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var text = (b.textContent || '').toLowerCase();
            if (text.indexOf('sign in with github') >= 0 || text.indexOf('sign in') >= 0 && text.indexOf('github') >= 0) {
              b.click();
              clearInterval(timer);
              return;
            }
          }
        }, 250);
      })();
    </script>
  </body>
</html>
