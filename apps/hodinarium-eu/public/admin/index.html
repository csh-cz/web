<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hodinárium — administrace</title>
  </head>
  <body>
    <!--
      Sveltia CMS — drop-in editor pro content collections.
      Auth gating řeší Cloudflare Access PŘED touto stránkou (OTP email),
      takže k UI se dostane jen někdo na allow-list (CSH editoři group).
      Skutečné committy do GitHubu jdou přes csh-cms-proxy Worker, který
      drží GitHub PAT bota cshbot.

      DŮLEŽITÉ: NEPRE-POPULOVAT localStorage klíčem 'netlify-cms-user'.
      Sveltia (a Decap) ho interpretují jako signál že běží Netlify Identity
      Service → otevírá popup na api.netlify.com → 404 "Not Found".
      Auth flow je řešen přes backend.base_url v config.yml + Worker /auth.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Auto-click "Sign in with GitHub" jakmile se Sveltia login screen
      // vyrenderuje. CF Access session je už platná (sdílená auth_domain),
      // takže popup projde bez druhého OTP a Sveltia uloží session.
      (function () {
        let attempts = 0;
        let clicked = false;
        const timer = setInterval(() => {
          if (++attempts > 80) {  // 80 × 250ms = 20s
            clearInterval(timer);
            if (!clicked) console.warn('CMS auto-login: GitHub button nenalezen za 20s');
            return;
          }
          const candidates = document.querySelectorAll('button, [role=button], a');
          for (const b of candidates) {
            const t = (b.textContent || '').toLowerCase().trim();
            if (!t) continue;
            // Vyloučit "Sign in with Token" — to je PAT mode, ne náš flow.
            if (t.includes('token') || t.includes('pat')) continue;
            if (t.includes('github')) {
              console.log('CMS auto-login: klikám na', JSON.stringify(t.slice(0, 60)));
              b.click();
              clicked = true;
              clearInterval(timer);
              return;
            }
          }
        }, 250);

        // Po 6s pokud Sveltia stále ukazuje login screen, zobraz nápovědu.
        setTimeout(() => {
          if (clicked) return;
          const banner = document.createElement('div');
          banner.style.cssText =
            'position:fixed;top:0;left:0;right:0;background:#fff3cd;border-bottom:1px solid #ffeaa7;padding:.75rem 1rem;font:14px system-ui;z-index:99999;text-align:center';
          banner.innerHTML =
            '<strong>CMS přihlášení:</strong> klikni dole <em>"Sign in with GitHub"</em>. ' +
            'CF Access OTP už máš platný, popup projde bez druhého kódu.';
          document.body.appendChild(banner);
        }, 6000);
      })();
    </script>
  </body>
</html>
