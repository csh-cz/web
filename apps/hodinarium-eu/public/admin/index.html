<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hodinárium — administrace</title>
  </head>
  <body>
    <!--
      Sveltia CMS — drop-in editor pro content collections.
      Auth gating řeší Cloudflare Access (Google OAuth) PŘED touto stránkou,
      takže k UI se dostane jen někdo na allow-list.
      Skutečné committy do GitHubu jdou přes csh-cms-proxy Worker, který
      drží GitHub PAT bota cshbot.
    -->
    <script>
      // Pre-populate Sveltia auth state z CF Access identity → editor neuvidí
      // Sveltia login screen vůbec, jen CF Access (Google/FB/OTP).
      // Worker /api/auth/user vrací editora podle Cf-Access-Authenticated-User-Email.
      // Token v storage je placeholder; Worker ho v API requestech přepíše na bot PAT.
      (async function () {
        const WORKER = 'https://csh-cms-proxy.david-knespl.workers.dev';
        try {
          const r = await fetch(WORKER + '/api/auth/user', { credentials: 'include' });
          if (!r.ok) throw new Error('auth/user ' + r.status);
          const u = await r.json();
          if (!u.authenticated || !u.email) throw new Error('not authenticated');
          // Sveltia/Decap kompatibilní user objekt
          const user = {
            backendName: 'github',
            token: 'cf-access:' + u.email,  // placeholder, Worker ho přepíše
            login: u.login || u.email.split('@')[0],
            name: u.email.split('@')[0],
            email: u.email,
            avatar_url: '',
          };
          // Zkus všechny známé klíče (Sveltia + Decap fallback)
          for (const key of ['sveltia-cms.user', 'decap-cms.user', 'netlify-cms-user']) {
            localStorage.setItem(key, JSON.stringify(user));
          }
          // IndexedDB Sveltia má vlastní session storage — nelze pre-populate
          // bez deeper integrace. Fallback: pokud Sveltia stejně ukáže login,
          // auto-klikne na první GitHub button (níž v poll).
        } catch (e) {
          console.warn('CMS auto-login: fetch user failed:', e);
        }

        // Načti Sveltia až po pre-populate
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        document.head.appendChild(s);

        // Pojistka: pokud i s pre-populate Sveltia ukáže login screen
        // (Sveltia ukládá session v IndexedDB, ne localStorage → pre-populate
        // localStorage Sveltia ignoruje a vždy ukáže "Sign in with GitHub" /
        // "Sign in with Token" buttony). Auto-klikni GitHub button.
        let attempts = 0;
        let clicked = false;
        const timer = setInterval(() => {
          if (++attempts > 80) {  // 80 × 250ms = 20s
            clearInterval(timer);
            if (!clicked) console.warn('CMS auto-login: GitHub button nenalezen za 20s');
            return;
          }
          // Match širší pattern — Sveltia button může být <button>Sign in with GitHub</button>,
          // <button><svg/>GitHub</button>, "Continue with GitHub", apod.
          // Hledáme button (nebo element role=button) co obsahuje "github" v textu.
          const candidates = document.querySelectorAll('button, [role=button], a');
          for (const b of candidates) {
            const t = (b.textContent || '').toLowerCase().trim();
            if (!t) continue;
            // Vyloučit "Sign in with Token" / "Personal access token" / "PAT".
            if (t.includes('token') || t.includes('pat')) continue;
            if (t.includes('github')) {
              console.log('CMS auto-login: klikám na', JSON.stringify(t.slice(0, 60)));
              b.click();
              clicked = true;
              clearInterval(timer);
              return;
            }
          }
        }, 250);

        // Po 6s pokud Sveltia stále ukazuje login screen (clicked=false),
        // zobraz user-visible nápovědu nad UI s ručním tlačítkem.
        setTimeout(() => {
          if (clicked) return;
          const buttons = Array.from(document.querySelectorAll('button')).filter(
            (b) => /github|sign in/i.test(b.textContent || ''),
          );
          if (buttons.length === 0) return;
          const banner = document.createElement('div');
          banner.style.cssText =
            'position:fixed;top:0;left:0;right:0;background:#fff3cd;border-bottom:1px solid #ffeaa7;padding:.75rem 1rem;font:14px system-ui;z-index:99999;text-align:center';
          banner.innerHTML =
            '<strong>CMS přihlášení:</strong> klikni dole <em>"Sign in with GitHub"</em>. ' +
            'CF Access OTP už máš platný, popup projde bez druhého kódu.';
          document.body.appendChild(banner);
        }, 6000);
      })();
    </script>
  </body>
</html>
