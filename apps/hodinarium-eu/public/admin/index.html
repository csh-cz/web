<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hodinárium — administrace</title>
  </head>
  <body>
    <!--
      Sveltia CMS — drop-in editor pro content collections.
      Auth gating řeší Cloudflare Access PŘED touto stránkou (OTP email),
      takže k UI se dostane jen někdo na allow-list (CSH editoři group).
      Skutečné committy do GitHubu jdou přes csh-cms-proxy Worker, který
      drží GitHub PAT bota cshbot.

      DŮLEŽITÉ:
      - NEPRE-POPULOVAT localStorage 'netlify-cms-user' → Sveltia by to
        interpretovala jako Netlify Identity Service → 404 api.netlify.com.
      - NEAUTO-KLIKAT "Sign in with GitHub" přes setInterval → Safari ITP
        blokuje window.open mimo user gesture → popup je null → Sveltia
        pollí null?.closed donekonečna → "Signing in…" zamrzne.

      Auth flow je řešen přes backend.base_url v config.yml + Worker /auth.
      User klikne ručně "Sign in with GitHub" → popup → Worker → token.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- CSH editor helpers (settings panel + spell-checker + AI našeptávač).
         Vše opt-in v UI panelu „⚙ Pomocníci" (vlevo dole). Default OFF —
         uživatel zapne, co chce. Settings persistují v localStorage. -->
    <script src="/admin/csh-editor-helpers.js"></script>
    <script src="/admin/csh-spellchecker.js"></script>
    <script src="/admin/csh-ai-naseptavac.js"></script>
    <script>
      // "← Zpět na web" trvalý overlay v rohu CMS.
      //
      // Editor často chce odejít z CMS bez uložení (jen se podíval, omylem
      // klikl, atd.). Sveltia samo nemá viditelné "exit to site" tlačítko —
      // navigace zpět vyžaduje buď uložit článek, nebo manuálně přepsat URL.
      //
      // Tenhle overlay je floating button vlevo nahoře (mimo Sveltia chrome),
      // klik = okamžitý přechod na původní stránku (sessionStorage
      // `cms-return-url` co Base.astro uloží před navigací do CMS), nebo na
      // homepage, pokud editor přišel přímo přes /admin/.
      (function () {
        const btn = document.createElement('a');
        btn.id = 'cms-back-to-site';
        let returnUrl = '/';
        try { returnUrl = sessionStorage.getItem('cms-return-url') || '/'; } catch {}
        btn.href = returnUrl;
        btn.textContent = '← Zpět na web';
        btn.title = 'Opustit CMS bez uložení a vrátit se na ' + returnUrl;
        btn.style.cssText =
          'position:fixed;top:.6rem;left:.6rem;z-index:99998;' +
          'background:#1a1a1a;color:#e8d8a8;text-decoration:none;' +
          'padding:.45rem .85rem;border-radius:2rem;' +
          'border:1px solid #c9a85d;box-shadow:0 2px 8px rgba(0,0,0,.4);' +
          'font:500 13px/1.2 ui-serif,Georgia,serif;letter-spacing:.02em;' +
          'transition:all 150ms ease;cursor:pointer';
        btn.addEventListener('mouseenter', () => {
          btn.style.background = '#c9a85d';
          btn.style.color = '#1a1a1a';
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.background = '#1a1a1a';
          btn.style.color = '#e8d8a8';
        });
        // Při kliku zahodit case sessionStorage hodnotu, aby se po další
        // návštěvě CMS nebrala stará URL.
        btn.addEventListener('click', () => {
          try { sessionStorage.removeItem('cms-return-url'); } catch {}
        });
        document.body.appendChild(btn);

        // "Odhlásit" tlačítko vedle "← Zpět na web" — zahodí Cloudflare
        // Access session pro celou Apps Team. Editor se po dalším pokusu
        // o /admin/ znovu authuje (OTP nebo SSO).
        const logout = document.createElement('a');
        logout.id = 'cms-logout';
        logout.href = '/cdn-cgi/access/logout';
        logout.textContent = '⎋ Odhlásit';
        logout.title = 'Odhlásit z editor režimu — zahodí Cloudflare Access session';
        logout.style.cssText =
          'position:fixed;top:.6rem;left:10.5rem;z-index:99998;' +
          'background:#1a1a1a;color:#e8a8a8;text-decoration:none;' +
          'padding:.45rem .85rem;border-radius:2rem;' +
          'border:1px solid #b04848;box-shadow:0 2px 8px rgba(0,0,0,.4);' +
          'font:500 13px/1.2 ui-serif,Georgia,serif;letter-spacing:.02em;' +
          'transition:all 150ms ease;cursor:pointer';
        logout.addEventListener('mouseenter', () => {
          logout.style.background = '#b04848';
          logout.style.color = '#fff';
        });
        logout.addEventListener('mouseleave', () => {
          logout.style.background = '#1a1a1a';
          logout.style.color = '#e8a8a8';
        });
        document.body.appendChild(logout);
      })();
    </script>
    <script>
      // Návrat na původní stránku po Save / Cancel.
      //
      // Pokud editor byl otevřen kliknutím na floating "Upravit" na detail
      // stránce, Base.astro uložil return URL do sessionStorage před
      // navigací. Sveltia routuje přes hash — když user uloží článek,
      // vrátí se z `#/collections/<col>/entries/<slug>` zpět na
      // `#/collections/<col>`. To detekujeme a redirect na return URL.
      //
      // Pokud user otevřel /admin/ přímo (přes admin avatar v navu),
      // sessionStorage nemá nic → žádný redirect, zůstane v CMS.
      (function () {
        let prevHash = window.location.hash;
        window.addEventListener('hashchange', () => {
          const newHash = window.location.hash;
          const wasInEntry = /^#\/collections\/[^/]+\/entries\//.test(prevHash);
          const isInList = /^#\/collections\/[^/]+\/?$/.test(newHash) || newHash === '' || newHash === '#/';
          prevHash = newHash;
          if (!wasInEntry || !isInList) return;

          let url = null;
          try { url = sessionStorage.getItem('cms-return-url'); } catch {}
          if (!url) return;
          try { sessionStorage.removeItem('cms-return-url'); } catch {}

          // Krátké zpoždění aby Sveltia stihla zobrazit "Saved" toast.
          setTimeout(() => { window.location.href = url; }, 600);
        });
      })();
    </script>
    <script>
      // Banner s nápovědou — zobrazí se POUZE na úvodní Sveltia login obrazovce
      // (= když je v DOM viditelné tlačítko "Sign in with GitHub"). Po kliku
      // na něj nebo po načtení editoru (tlačítko zmizí) se banner skryje,
      // aby nezakrýval UI editoru.
      (function () {
        const banner = document.createElement('div');
        banner.id = 'cms-helper-banner';
        banner.style.cssText =
          'position:fixed;top:0;left:0;right:0;background:#fff3cd;border-bottom:1px solid #ffeaa7;padding:.6rem 1rem;font:14px/1.4 system-ui;z-index:99999;text-align:center;color:#664d03;display:none';
        banner.innerHTML =
          '<strong>Přihlášení do CMS:</strong> klikni dole <em>"Sign in with GitHub"</em>. ' +
          'Otevře se okno Cloudflare Access — pokud máš platnou session, projde tichém.';
        document.body.appendChild(banner);

        function hasGitHubLoginButton() {
          const candidates = document.querySelectorAll('button, [role=button], a');
          for (const b of candidates) {
            const t = (b.textContent || '').toLowerCase().trim();
            if (!t) continue;
            if (t.includes('token') || t.includes('pat')) continue;
            if (t.includes('sign in') && t.includes('github')) return true;
          }
          return false;
        }

        function update() {
          banner.style.display = hasGitHubLoginButton() ? 'block' : 'none';
        }

        // Initial check + polluj DOM změny (Sveltia mountuje async).
        update();
        const obs = new MutationObserver(update);
        obs.observe(document.body, { childList: true, subtree: true });

        // Bezpečnostní timeout: po 60 s observer odpojit (úspora CPU
        // — editor je už dávno mountnutý, login button se nevrátí).
        setTimeout(() => obs.disconnect(), 60000);
      })();
    </script>
  </body>
</html>
