<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hodinárium — administrace</title>
  </head>
  <body>
    <!--
      Sveltia CMS — drop-in editor pro content collections.
      Auth gating řeší Cloudflare Access PŘED touto stránkou (OTP email),
      takže k UI se dostane jen někdo na allow-list (CSH editoři group).
      Skutečné committy do GitHubu jdou přes csh-cms-proxy Worker, který
      drží GitHub PAT bota cshbot.

      DŮLEŽITÉ:
      - NEPRE-POPULOVAT localStorage 'netlify-cms-user' → Sveltia by to
        interpretovala jako Netlify Identity Service → 404 api.netlify.com.
      - NEAUTO-KLIKAT "Sign in with GitHub" přes setInterval → Safari ITP
        blokuje window.open mimo user gesture → popup je null → Sveltia
        pollí null?.closed donekonečna → "Signing in…" zamrzne.

      Auth flow je řešen přes backend.base_url v config.yml + Worker /auth.
      User klikne ručně "Sign in with GitHub" → popup → Worker → token.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Banner s nápovědou — informuje editora že má kliknout ručně.
      // CF Access auth_domain sdílí session, takže popup neptá na druhý OTP.
      (function () {
        const banner = document.createElement('div');
        banner.id = 'cms-helper-banner';
        banner.style.cssText =
          'position:fixed;top:0;left:0;right:0;background:#fff3cd;border-bottom:1px solid #ffeaa7;padding:.6rem 1rem;font:14px/1.4 system-ui;z-index:99999;text-align:center;color:#664d03';
        banner.innerHTML =
          '<strong>Přihlášení do CMS:</strong> klikni dole <em>"Sign in with GitHub"</em>. ' +
          'Otevře se okno přihlášení Cloudflare Access — tvoje OTP session už platí, ' +
          'takže se to přihlásí samo a okno se zavře.';
        document.body.appendChild(banner);

        // Po kliknutí na GitHub button skryj banner — popup se otevírá.
        document.addEventListener('click', function (e) {
          const t = e.target;
          if (!t || !t.closest) return;
          const btn = t.closest('button, [role=button], a');
          if (!btn) return;
          const text = (btn.textContent || '').toLowerCase();
          if (text.includes('github') && !text.includes('token') && !text.includes('pat')) {
            const b = document.getElementById('cms-helper-banner');
            if (b) b.remove();
          }
        }, true);
      })();
    </script>
  </body>
</html>
