<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grahamův klidový krok (deadbeat escapement) — schematická animace v5.

  Vznikla pro Hodinarium-eu / Český spolek horologický, 2026-05-26.
  Předloha: Chetvorno, "Graham Escapement" (Wikimedia Commons, Public Domain),
  https://commons.wikimedia.org/wiki/File:Graham_Escapement.svg

  ====== FYZIKA GRAHAMOVA KLIDOVÉHO KROKU ======

  Předpoklady:
  - 30zubé kolo, rozteč zubů 12° (= 360°/30)
  - kotva pevně spojena s kyvadlem (přes crutch), perioda 2 s
  - kotva má 2 palety (entry vlevo, exit vpravo), každá s:
    * LOCK FACE (kruhový oblouk soustředný s osou kotvy = "dead face")
    * IMPULSE FACE (krátký úkos na hraně) — předává energii zubu

  ====== AIRYHO TEORÉM (Airy 1826) ======

  Impulse se předává PŘI PRŮCHODU KYVADLA SVISLOU POLOHOU
  (= max rychlost, min citlivost na poruchy). Tj. v cyklu animace
  v t=0.25 a t=0.75, kde kyvadlo prochází 0°. Lock dominuje
  zbytek času (~80%) — během lock kolo úplně STOJÍ (odtud
  "deadbeat" = mrtvý úder, na rozdíl od recoil typu kde kolo couvá).

  ====== TIMING ANIMACE (perioda 2 s) ======

  t = 0.00  : kyvadlo +6° (extrém vlevo). LEVÁ paleta locked.
  t = 0.00 → 0.22  : LOCK 1 (~22% periody) — kolo stojí,
                     kotva osciluje volně přes dead face.
  t = 0.22 → 0.245 : UNLOCK + IMPULSE 1 — zub klouže po úkosu
                     levé palety, kolo se posune o +10°.
                     Kyvadlo právě prochází ~0° (Airy).
  t = 0.245 → 0.255: DROP 1 — zub uklouzne z hrany, kolo volně
                     proletí dalších +2°. Slyšitelný TIK.
  t = 0.25  : kyvadlo 0° (svislé). Kolo na +12° (1 zub).
  t = 0.255 → 0.72 : LOCK 2 (~47% periody) — pravá paleta
                     locked, kotva pokračuje k -6° extrému a zpět.
  t = 0.50  : kyvadlo -6° (extrém vpravo). Kolo stále na +12°.
  t = 0.72 → 0.745 : UNLOCK + IMPULSE 2 — zub klouže po úkosu
                     pravé palety, kolo o +10°.
  t = 0.745 → 0.755: DROP 2 — kolo o +2°.
  t = 0.75  : kyvadlo 0°. Kolo na +24°.
  t = 0.755 → 1.00 : LOCK 1 — levá paleta opět drží zub.
  t = 1.00  : kyvadlo +6° (extrém vlevo). Cyklus opakuje.

  Za jednu periodu (2s) kolo postoupí CW o 24° (= 2 zuby).
  Za 30 s = 15 period × 24° = 360° (celá otáčka).

  Geometrie postupu kola za 1 zub (12° rozteč):
  - IMPULSE arc (úkos palety): ~10° na kole
  - DROP angle: ~2° na kole
  - LOCK arc: 0° (kolo nepostoupí, jen kotva osciluje)

  Pozn. k amplitudě: reálné Graham regulátory mají kyvadlo
  ±1,5–2,5°. Pro vizuální čitelnost přeháníme na ±6°.

  ====== VIZUÁLNÍ INDIKACE ======

  - Rubínový kruh nad palety bliká v LOCK fázi té palety,
    která drží zub (vizualizuje "active pallet")
  - Sépiový text nahoře střídá "LOCK" ↔ "IMPULSE → DROP"
  - Tenká CCW šipka indikuje směr rotace kola

  License: CC BY 4.0 (Český spolek horologický)
  Předloha: PD — atribuce zachována v note u ::photo directive.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 475 625"
     width="475"
     height="625"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Grahamův klidový krok — schematická animace</title>
  <desc id="desc">
    Krokové kolo (mosaz, 30 zubů) se otáčí po směru hodinových ručiček
    diskrétními skoky po jednom zubu (12°), synchronizovaně s průchodem
    kyvadla svislou polohou (Airyho teorém). Mezi skoky kolo STOJÍ
    (deadbeat). Kotva (ocel) osciluje ±6° kolem horního pivotu;
    rubínový highlight ukazuje aktuálně zachycující paletu, sépiový text
    nahoře střídá fáze LOCK ↔ IMPULSE + DROP.
  </desc>

  <style>
    .krok-popisek {
      font: 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 400;
      fill: #3A2818;
    }
    .krok-popisek-cislo {
      font: 600 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      fill: #3A2818;
    }
    .krok-popisek-mensi {
      font: 10px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 400;
      fill: #3A2818;
      opacity: 0.7;
    }
    .krok-popisek-faze {
      font: 600 16px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Pozadí (krémový papír) -->
  <rect x="0" y="0" width="475" height="625" fill="#F0E4C8"/>

  <!-- ====== POMOCNÉ ČÁRY: LOCK ARCS ======
       Kruhové oblouky soustředné s osou kotvy (pivot 242, 42.7) na poloměrech
       r=243 (OUTER edge LEVÉ palety) a r=222 (INNER edge PRAVÉ palety).
       Ukazují DRÁHU, po které klouže zub během LOCK fáze — to je definice
       deadbeat: paleta = kruhový oblouk → tečná síla nulová → kolo stojí.
       Geometrie 1:1 podle Wikipedia path6132 (jen sépia místo červené). -->
  <g stroke="#6B4A2E" stroke-width="1.4" fill="none" stroke-dasharray="6 4" opacity="0.45">
    <path d="M 147.36007,266.60891 C 68.49586,233.1705 13.07385,160.66607 1.5,75.79123"/>
    <path d="M 463.55796,60.04066 c -7.13549,88.64484 -66.61987,164.41657 -151.03671,192.39192"/>
  </g>

  <!-- CW šipka — statická indikace směru rotace kola, dolní pravý roh -->
  <g opacity="0.55" stroke="#3A2818" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M 425 510 Q 447 470 437 425" />
    <path d="M 437 425 L 445 433 M 437 425 L 429 437" />
    <text x="415" y="500" class="krok-popisek-mensi" stroke="none" fill="#3A2818" opacity="1" text-anchor="end">CW</text>
  </g>

  <!-- ====== KROKOVÉ KOLO ======
       Diskrétní tick: 2 ticks za periodu kyvadla (4 s), každý tick 12° (1 zub).
       Hold 90% času, impulse window 10% (přesun 0 → 12° během 0.4 s).
       `accumulate="sum"` → kolo postupuje plynule (15 period × 24° = 360°
       za 60 s). Kladné úhly v SVG = rotace CW (po směru hodinových ručiček). -->
  <g>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      values="0 239.5 372.6;
              0 239.5 372.6;
              12 239.5 372.6;
              12 239.5 372.6;
              24 239.5 372.6"
      keyTimes="0; 0.45; 0.5; 0.95; 1"
      calcMode="linear"
      dur="4s"
      begin="0s"
      repeatCount="indefinite"
      accumulate="sum"/>

    <!-- Tělo kola s 30 zuby (předloha path4992) — přebarveno na mosaz -->
    <path d="m 241.79465,136.275 -41.40625,62.25 c -5.97718,1.34016 -11.82856,2.98298 -17.5625,4.90625 l 9.8125,-62.59375 -27.65625,69.65625 c -5.51938,2.54462 -10.89581,5.36326 -16.09375,8.4375 L 145.48215,155.525 132.8884,229.5875 c -4.83811,3.615 -9.4647,7.4858 -13.90625,11.5625 l -16.59375,-61.46875 3.09375,75.25 c -3.9509,4.498 -7.69904,9.18102 -11.1875,14.0625 l -29,-56.75 18.65625,73.03125 c -2.92648,5.20163 -5.59653,10.55464 -8,16.0625 l -40.1875,-49.5 33.46875,67.5625 c -1.77712,5.68901 -3.29274,11.48843 -4.5,17.40625 L 15.10715,296.7125 61.91965,355.9 c -0.51549,5.527 -0.78125,11.11958 -0.78125,16.78125 0,0.36666 -0.002,0.72761 0,1.09375 L 4.23215,344.9 l 58.0625,48.09375 c 0.67861,5.98846 1.65008,11.89389 2.90625,17.6875 L 3.6384,394.275 l 66.625,34.90625 c 1.91201,5.73475 4.10084,11.32216 6.5625,16.78125 l -63.53125,-3.25 72.375,20.28125 c 3.05368,5.19523 6.32768,10.22104 9.875,15.0625 l -62.71875,10 74.8125,4.8125 c 4.05702,4.45164 8.3597,8.6969 12.84375,12.71875 l -59.125,22.78125 74,-10.84375 c 4.90075,3.53326 9.99451,6.81221 15.25,9.84375 L 97.6384,561.9 167.48215,535.9625 c 5.55788,2.46118 11.25491,4.63828 17.09375,6.53125 l -44.5,44.625 62.78125,-39.78125 c 5.96259,1.24986 12.02174,2.20603 18.1875,2.84375 l -34.1875,52.78125 53,-51.8125 c 6.22654,-0.009 12.37567,-0.33811 18.4375,-0.96875 l -22.375,58.5625 40.9375,-61.5 c 6.10255,-1.29551 12.08287,-2.91089 17.9375,-4.8125 l -9.6875,61.75 27.15625,-68.4375 c 5.70734,-2.5458 11.25292,-5.39154 16.625,-8.5 l 3.375,62.25 12.3125,-72.46875 c 5.04911,-3.6767 9.9021,-7.60723 14.53125,-11.78125 l 16.21875,60.09375 -3,-73.34375 c 4.18443,-4.64997 8.12955,-9.52128 11.8125,-14.59375 l 28.3125,55.375 -18.15625,-70.96875 c 3.13207,-5.42309 5.9727,-11.0485 8.53125,-16.8125 l 39.125,48.1875 -32.46875,-65.5625 c 1.92789,-5.96335 3.54502,-12.06163 4.84375,-18.28125 l 48.28125,38.96875 -45.40625,-57.375 c 0.60945,-6.00011 0.90625,-12.08898 0.90625,-18.25 0,-0.22 8e-4,-0.43644 0,-0.65625 l 55.375,28.09375 -56.40625,-46.75 c -0.67932,-6.31123 -1.68016,-12.52823 -3,-18.625 l 60.03125,16 -64.96875,-34.03125 c -1.97827,-5.99429 -4.26626,-11.86804 -6.84375,-17.5625 l 62.125,3.15625 -70.78125,-19.84375 c -3.17636,-5.41108 -6.63295,-10.62896 -10.34375,-15.65625 l 61.625,-9.84375 -73.5625,-4.71875 c -4.19996,-4.59235 -8.65819,-8.96162 -13.3125,-13.09375 l 58.34375,-22.53125 -73.125,10.71875 c -5.03765,-3.59935 -10.27882,-6.93052 -15.6875,-10 L 380.10715,183.11875 310.6384,208.9 c -5.64804,-2.45313 -11.44159,-4.63201 -17.375,-6.5 l 44.375,-44.5 -62.8125,39.78125 c -5.98743,-1.19853 -12.06247,-2.10427 -18.25,-2.6875 l 34.28125,-52.9375 -53.34375,52.15625 c -6.1754,0.0711 -12.2718,0.44172 -18.28125,1.125 l 22.5625,-59.0625 z m -2.1875,75 c 47.40446,0 90.03354,20.42667 119.5625,52.96875 L 261.8259,344.5875 c -6.10655,-4.83872 -13.82241,-7.71875 -22.21875,-7.71875 -1.73549,0 -3.42423,0.13641 -5.09375,0.375 L 189.7009,219.15 c 15.71565,-5.1045 32.48865,-7.875 49.90625,-7.875 z m -66.46875,14.25 46.375,117.46875 c -7.85423,5.32824 -13.44686,13.7215 -15.15625,23.4375 L 78.2009,372.525 c 0.0623,-65.38725 38.98692,-121.6917 94.9375,-147 z m 197.21875,52.5 c 19.28531,26.59215 30.65625,59.29474 30.65625,94.65625 0,29.31513 -7.80844,56.80546 -21.46875,80.5 l -106.46875,-67.75 c 1.5117,-3.96362 2.34375,-8.25543 2.34375,-12.75 0,-5.56293 -1.26798,-10.83419 -3.53125,-15.53125 l 98.46875,-79.125 z m -165.1875,104.46875 c 2.64918,9.29791 8.96591,17.04245 17.28125,21.59375 l -33.25,121.96875 C 130.10928,506.64968 86.09365,454.04874 79.16965,390.30625 l 126,-7.8125 z m 58.9375,16.3125 105.71875,69.25 c -29.37284,40.03341 -76.75918,66.03125 -130.21875,66.03125 -11.38857,0 -22.49667,-1.19406 -33.21875,-3.4375 l 31.53125,-122.21875 c 0.55937,0.026 1.12172,0.0625 1.6875,0.0625 9.46974,0 18.0958,-3.68539 24.5,-9.6875 z"
       fill="#E6C97A" stroke="#8A6E35" stroke-width="1.4" stroke-linejoin="miter" stroke-linecap="round"/>

    <!-- Středový čep kola (předloha path4988) -->
    <circle cx="239.61" cy="372.67" r="16.72" fill="#3A2818" stroke="none"/>
  </g>

  <!-- ====== KOTVA + KYVADLO + PALETOVÉ HIGHLIGHT ======
       Oscilace ±6° kolem horního pivotu (242, 42.7) — přehnaná amplituda
       pro vizuální čitelnost (reálné Graham regulátory: ±1,5–2,5°).
       Kyvadlo na svislé (0°) v t=0.25 a t=0.75 — sync s impulse okny kola.
       Highlight palet (rubín) bliká v lock fázi té palety, která drží zub. -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="6 242 42.7; -6 242 42.7; 6 242 42.7"
      keyTimes="0; 0.5; 1"
      dur="4s"
      begin="0s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Kyvadlová tyč: hrot na konci (předloha path6112) -->
    <path d="m 261.6309,622.17293 c -2.23017,1.25778 -4.48017,0.84442 -7.23619,-0.17647 l 6.88654,-6.74472 0.34965,6.92119 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1"/>

    <!-- Kyvadlová tyč (předloha rect6109) -->
    <path d="m 237.47806,65.911658 11.98442,-0.313642 12.02665,555.535694 c -4.13975,-3.45484 -8.13302,3.9376 -11.98442,0.31364 L 237.47806,65.911658 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="miter"/>

    <!-- Kotva (předloha path6134) — vrchní díl s V-tvarem -->
    <path d="m 242.16965,0.65 c -10.89209,0 -20.79809,4.185503 -28.21875,11.03125 L 39.98215,177.025 l 0.0937,0.0625 -0.28125,0.21875 c 8.77569,13.2201 18.82472,25.48484 29.9375,36.6875 L 91.9196,204.2125 C 82.41582,195.35247 73.68642,185.66683 65.8571,175.24375 96.52129,147.47318 197.66617,56.025 200.16965,56.025 c 0.95645,0 2.06025,0.49383 3.125,1.125 5.98902,15.64954 21.11949,26.78125 38.875,26.78125 18.82456,0 34.75276,-12.51049 39.90625,-29.65625 0.70893,-0.35538 1.4208,-0.60208 2.0625,-0.625 2.56502,-0.0916 111.43742,92.46091 139.53125,116.375 -5.98454,8.47775 -12.46405,16.40297 -19.375,23.78125 l 9.84375,20.78125 c 13.27525,-13.32312 25.21445,-28.39104 35.4375,-45.15625 l -0.3125,-0.1875 0.125,-0.0937 L 268.85715,10.3375 C 261.62973,4.295441 252.32671,0.65 242.16965,0.65 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="miter"/>

    <!-- Pivot kotvy — černé očko (předloha path6114) -->
    <circle cx="242.04" cy="42.69" r="13.78" fill="#3A2818" stroke="none"/>

    <!-- Šrouby kotvy odstraněny — v originální Wikipedii se vizuálně
         "schovávaly" v monochromatickém renderu (vše šedé), ale v naší
         barevné variantě geometricky vyčnívaly mimo tělo kotvy (anchor
         body je úzký kolem pivotu). Vzhledem k tomu, že screws nepřinášejí
         didaktickou hodnotu pro vysvětlení deadbeat fází lock/release/
         impulse/drop, raději je vynecháme — méně vizuálního šumu. -->

    <!-- HIGHLIGHT LEVÉ PALETY — rubín, aktivní v lock 1 fázi
         (t=0→0.22 a t=0.755→1.0, kdy levá paleta drží zub).
         Pozice na PALLET INNER edge (kontakt se zubem kola) cca (92, 204)
         podle geometrie path6134 a wheel tooth tips. -->
    <circle cx="92" cy="204" r="11" fill="#B85068" opacity="0">
      <animate attributeName="opacity"
        values="0.8; 0.8; 0; 0; 0; 0.8; 0.8"
        keyTimes="0; 0.22; 0.225; 0.755; 0.76; 0.765; 1"
        calcMode="linear"
        dur="4s"
        begin="0s"
        repeatCount="indefinite"/>
    </circle>

    <!-- HIGHLIGHT PRAVÉ PALETY — rubín, aktivní v lock 2 fázi
         (t=0.255→0.72, kdy pravá paleta drží zub).
         Pozice symetricky vůči ose x=237.5: inner edge cca (383, 204). -->
    <circle cx="383" cy="204" r="11" fill="#B85068" opacity="0">
      <animate attributeName="opacity"
        values="0; 0; 0.8; 0.8; 0; 0"
        keyTimes="0; 0.255; 0.26; 0.72; 0.725; 1"
        calcMode="linear"
        dur="4s"
        begin="0s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ====== FÁZOVÝ INDIKÁTOR (text nahoře) ======
       Střídá "LOCK" (sépie) a "IMPULSE → DROP" (rubín) podle aktuální
       fáze cyklu. Visuálně zvýrazňuje co se právě v mechanismu děje. -->
  <g text-anchor="middle">
    <text x="237.5" y="25" class="krok-popisek-faze" fill="#3A2818" opacity="1">
      LOCK
      <animate attributeName="opacity"
        values="1; 1; 0; 0; 1; 1; 0; 0; 1"
        keyTimes="0; 0.22; 0.225; 0.255; 0.26; 0.72; 0.725; 0.755; 1"
        calcMode="linear"
        dur="4s"
        begin="0s"
        repeatCount="indefinite"/>
    </text>
    <text x="237.5" y="25" class="krok-popisek-faze" fill="#B85068" opacity="0">
      IMPULSE → DROP
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0; 1; 1; 0"
        keyTimes="0; 0.22; 0.225; 0.255; 0.26; 0.72; 0.725; 0.755; 1"
        calcMode="linear"
        dur="4s"
        begin="0s"
        repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ====== POPISKY A/B/C/D + spodní atribuce ====== -->

  <!-- A — Krokové kolo (vlevo dole) -->
  <text x="6" y="395" class="krok-popisek-cislo">A</text>
  <text x="20" y="395" class="krok-popisek">— Krokové kolo (mosaz, 30 zubů)</text>

  <!-- B — Kotva (vlevo nahoře) -->
  <text x="6" y="72" class="krok-popisek-cislo">B</text>
  <text x="20" y="72" class="krok-popisek">— Kotva (ocel)</text>

  <!-- C — Palety (vpravo nahoře) -->
  <text x="410" y="200" class="krok-popisek-cislo" text-anchor="end">C</text>
  <text x="467" y="200" class="krok-popisek" text-anchor="end">— Palety</text>

  <!-- D — Tyč kyvadla (vpravo dole) -->
  <text x="410" y="560" class="krok-popisek-cislo" text-anchor="end">D</text>
  <text x="467" y="560" class="krok-popisek" text-anchor="end">— Tyč kyvadla</text>

  <!-- Spodní popis -->
  <text x="237.5" y="615" text-anchor="middle" class="krok-popisek-mensi">
    Grahamův klidový krok (G. Graham, 1715) — schematická animace
  </text>
</svg>
