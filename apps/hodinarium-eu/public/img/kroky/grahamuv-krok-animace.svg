<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grahamův klidový krok (deadbeat escapement) — schematická animace.

  Vznikla pro Hodinarium-eu / Český spolek horologický, 2026-05-26.
  Předloha: Chetvorno, "Graham Escapement" (Wikimedia Commons, Public Domain),
  https://commons.wikimedia.org/wiki/File:Graham_Escapement.svg

  Geometrie zachována 1:1 podle předlohy. Změny oproti originálu:
  - přebarveno do palety hodinarium-eu (viz docs/kroky-illustration-style.md):
    pastelová mosaz (kolo) × ocelová modř (kotva, tyč), sépiové obrysy,
    krémový papír v pozadí
  - odstraněny červené anotace b-b, a, c (zachována jen mechanika)
  - doplněna SMIL animace: kolo rotuje kontinuálně CCW (1 zub/s = 30s
    na otáčku), kotva + kyvadlová tyč oscilují ±3° kolem horního pivotu
    s periodou 2 s (sinusoidální průběh)

  License: CC BY 4.0 (Český spolek horologický)
  Předloha: PD — atribuce zachována v note u ::photo directive.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 475 625"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Grahamův klidový krok — schematická animace</title>
  <desc id="desc">
    Krokové kolo (mosaz, 30 zubů) kontinuálně rotuje proti směru
    hodinových ručiček. Kotva nahoře (ocel) pivotuje s amplitudou ±3°,
    kyvadlová tyč svisle dolů přes rovinu kola.
  </desc>

  <!-- Pozadí (krémový papír) -->
  <rect x="0" y="0" width="475" height="625" fill="#F0E4C8"/>

  <!-- ====== KROKOVÉ KOLO (rotace CCW kolem středu 239.5, 372.6) ====== -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 239.5 372.6"
      to="-360 239.5 372.6"
      dur="30s"
      repeatCount="indefinite"/>

