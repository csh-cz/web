  <!-- ====== KOTVA + KYVADLO (Vyskocil Shape 3) — oscilace ±2° ====== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="2 250 200; -2 250 200; 2 250 200" keyTimes="0; 0.5; 1"
      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
      dur="4s" repeatCount="indefinite"/>
    <g transform="translate(250, 200) scale(1.199)">
      <!-- Pendulum rod (Wikipedia style — simple thin steel rectangle) -->
      <rect x="-3" y="0" width="6" height="380" fill="#88A8C8" stroke="#3D5878" stroke-width="0.5"/>

      <!-- Pendulum čočka (mosaz lens at bottom) -->
      <circle cx="0" cy="385" r="12" fill="#E6C97A" stroke="#8A6E35" stroke-width="0.8"/>
      <circle cx="0" cy="385" r="4" fill="#8A6E35"/>

      <!-- Wikipedia anchor body (path6134) — modrá ocelová.
           Scale 0.438 (× outer 1.199 = effective 0.525) tak aby V tip
           OUTER edge dosáhla na wheel tooth tip at 45° contact angle
           (r=127.5 px od pivot v final canvas). -->
      <g transform="scale(0.438) translate(-242, -42.7)">
        <path d="m 242.16965,0.65 c -10.89209,0 -20.79809,4.185503 -28.21875,11.03125 L 39.98215,177.025 l 0.0937,0.0625 -0.28125,0.21875 c 8.77569,13.2201 18.82472,25.48484 29.9375,36.6875 L 91.9196,204.2125 C 82.41582,195.35247 73.68642,185.66683 65.8571,175.24375 96.52129,147.47318 197.66617,56.025 200.16965,56.025 c 0.95645,0 2.06025,0.49383 3.125,1.125 5.98902,15.64954 21.11949,26.78125 38.875,26.78125 18.82456,0 34.75276,-12.51049 39.90625,-29.65625 0.70893,-0.35538 1.4208,-0.60208 2.0625,-0.625 2.56502,-0.0916 111.43742,92.46091 139.53125,116.375 -5.98454,8.47775 -12.46405,16.40297 -19.375,23.78125 l 9.84375,20.78125 c 13.27525,-13.32312 25.21445,-28.39104 35.4375,-45.15625 l -0.3125,-0.1875 0.125,-0.0937 L 268.85715,10.3375 C 261.62973,4.295441 252.32671,0.65 242.16965,0.65 z"
              fill="#88A8C8" stroke="#3D5878" stroke-width="1.3"
              vector-effect="non-scaling-stroke"/>
      </g>

      <!-- Pivot kotvy — sépiové očko (Wikipedia path6114 style) -->
      <circle cx="0" cy="0" r="11.5" fill="#3A2818" stroke="none"/>
    </g>
  </g>

  <style>
    .lab { font: 400 12px 'Inter', sans-serif; fill: #3A2818; }
    .labn { font: 600 12px 'Inter', sans-serif; fill: #3A2818; }
    .att { font: 400 10px 'Inter', sans-serif; fill: #3A2818; opacity: 0.7; }
  </style>
  <text x="6" y="385" class="labn">A</text>
  <text x="20" y="385" class="lab">— Krokové kolo (mosaz, 30 zubů)</text>
  <text x="6" y="200" class="labn">B</text>
  <text x="20" y="200" class="lab">— Kotva (ocel)</text>
  <text x="488" y="245" class="labn" text-anchor="end">C</text>
  <text x="488" y="260" class="lab" text-anchor="end">— Palety</text>
  <text x="488" y="545" class="labn" text-anchor="end">D</text>
  <text x="488" y="560" class="lab" text-anchor="end">— Tyč kyvadla</text>
</svg>
