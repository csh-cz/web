<!--
  Grahamův klidový krok (deadbeat escapement) — schematická animace v11.

  Vznikla pro Hodinarium-eu / Český spolek horologický, 2026-05-27.
  Předloha: Volker Vyskocil, "Graham_0701" Flash animation,
  http://uhrentechnik.vyskocil.de/index.php?id=54
  SWF dekompilován přes JPEXS Free Flash Decompiler 26.2.1.
  Shape 3 (anchor + pallets + pendulum + crutch) + Shape 4 (wheel) extracted.
  Scale 1.199 jako v originální PlaceObject2.

  © Volker Vyskocil — www.uhrentechnik.de (atribuce v note ::photo directive)
  Překresleno: vlastní SMIL animace.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 650"
     width="500"
     height="650"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Grahamův klidový krok (per Vyskocil)</title>
  <desc id="desc">
    Krokové kolo rotuje CW, kotva oscilluje ±2°, pallets sedí na hraně zubů.
    Předloha: Volker Vyskocil flash animation.
  </desc>

  <rect x="0" y="0" width="500" height="650" fill="#F0E4C8"/>

