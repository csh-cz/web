.75 c -0.67932,-6.31123 -1.68016,-12.52823 -3,-18.625 l 60.03125,16 -64.96875,-34.03125 c -1.97827,-5.99429 -4.26626,-11.86804 -6.84375,-17.5625 l 62.125,3.15625 -70.78125,-19.84375 c -3.17636,-5.41108 -6.63295,-10.62896 -10.34375,-15.65625 l 61.625,-9.84375 -73.5625,-4.71875 c -4.19996,-4.59235 -8.65819,-8.96162 -13.3125,-13.09375 l 58.34375,-22.53125 -73.125,10.71875 c -5.03765,-3.59935 -10.27882,-6.93052 -15.6875,-10 L 380.10715,183.11875 310.6384,208.9 c -5.64804,-2.45313 -11.44159,-4.63201 -17.375,-6.5 l 44.375,-44.5 -62.8125,39.78125 c -5.98743,-1.19853 -12.06247,-2.10427 -18.25,-2.6875 l 34.28125,-52.9375 -53.34375,52.15625 c -6.1754,0.0711 -12.2718,0.44172 -18.28125,1.125 l 22.5625,-59.0625 z m -2.1875,75 c 47.40446,0 90.03354,20.42667 119.5625,52.96875 L 261.8259,344.5875 c -6.10655,-4.83872 -13.82241,-7.71875 -22.21875,-7.71875 -1.73549,0 -3.42423,0.13641 -5.09375,0.375 L 189.7009,219.15 c 15.71565,-5.1045 32.48865,-7.875 49.90625,-7.875 z m -66.46875,14.25 46.375,117.46875 c -7.85423,5.32824 -13.44686,13.7215 -15.15625,23.4375 L 78.2009,372.525 c 0.0623,-65.38725 38.98692,-121.6917 94.9375,-147 z m 197.21875,52.5 c 19.28531,26.59215 30.65625,59.29474 30.65625,94.65625 0,29.31513 -7.80844,56.80546 -21.46875,80.5 l -106.46875,-67.75 c 1.5117,-3.96362 2.34375,-8.25543 2.34375,-12.75 0,-5.56293 -1.26798,-10.83419 -3.53125,-15.53125 l 98.46875,-79.125 z m -165.1875,104.46875 c 2.64918,9.29791 8.96591,17.04245 17.28125,21.59375 l -33.25,121.96875 C 130.10928,506.64968 86.09365,454.04874 79.16965,390.30625 l 126,-7.8125 z m 58.9375,16.3125 105.71875,69.25 c -29.37284,40.03341 -76.75918,66.03125 -130.21875,66.03125 -11.38857,0 -22.49667,-1.19406 -33.21875,-3.4375 l 31.53125,-122.21875 c 0.55937,0.026 1.12172,0.0625 1.6875,0.0625 9.46974,0 18.0958,-3.68539 24.5,-9.6875 z"
       fill="#E6C97A" stroke="#8A6E35" stroke-width="1.4" stroke-linejoin="miter" stroke-linecap="round"/>

    <!-- Středový čep kola (předloha path4988) -->
    <circle cx="239.61" cy="372.67" r="16.72" fill="#3A2818" stroke="none"/>
  </g>

  <!-- ====== KOTVA + KYVADLO (oscilace ±3° kolem pivotu 242, 42.7) ====== -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-3 242 42.7; 3 242 42.7; -3 242 42.7"
      keyTimes="0; 0.5; 1"
      dur="2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Kyvadlová tyč: hrot na konci (předloha path6112) -->
    <path d="m 261.6309,622.17293 c -2.23017,1.25778 -4.48017,0.84442 -7.23619,-0.17647 l 6.88654,-6.74472 0.34965,6.92119 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1"/>

    <!-- Kyvadlová tyč (předloha rect6109) — dlouhý úzký pruh -->
    <path d="m 237.47806,65.911658 11.98442,-0.313642 12.02665,555.535694 c -4.13975,-3.45484 -8.13302,3.9376 -11.98442,0.31364 L 237.47806,65.911658 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="miter"/>

    <!-- Kotva (předloha path6134) — vrchní díl s V-tvarem -->
    <path d="m 242.16965,0.65 c -10.89209,0 -20.79809,4.185503 -28.21875,11.03125 L 39.98215,177.025 l 0.0937,0.0625 -0.28125,0.21875 c 8.77569,13.2201 18.82472,25.48484 29.9375,36.6875 L 91.9196,204.2125 C 82.41582,195.35247 73.68642,185.66683 65.8571,175.24375 96.52129,147.47318 197.66617,56.025 200.16965,56.025 c 0.95645,0 2.06025,0.49383 3.125,1.125 5.98902,15.64954 21.11949,26.78125 38.875,26.78125 18.82456,0 34.75276,-12.51049 39.90625,-29.65625 0.70893,-0.35538 1.4208,-0.60208 2.0625,-0.625 2.56502,-0.0916 111.43742,92.46091 139.53125,116.375 -5.98454,8.47775 -12.46405,16.40297 -19.375,23.78125 l 9.84375,20.78125 c 13.27525,-13.32312 25.21445,-28.39104 35.4375,-45.15625 l -0.3125,-0.1875 0.125,-0.0937 L 268.85715,10.3375 C 261.62973,4.295441 252.32671,0.65 242.16965,0.65 z"
       fill="#88A8C8" stroke="#3D5878" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="miter"/>

    <!-- Pivot kotvy — černé očko (předloha path6114) -->
    <circle cx="242.04" cy="42.69" r="13.78" fill="#3A2818" stroke="none"/>

    <!-- Šrouby v kotvě (3 kusy — předloha screw + 2× use) -->
    <g transform="translate(-101.3616,-81.475)">
      <circle cx="322.57" cy="144.01" r="7.54" fill="#F0E4C8" stroke="#3D5878" stroke-width="1.3"/>
      <path d="m 317.94781,138.07356 9.54465,11.40919" stroke="#3D5878" stroke-width="1" fill="none"/>
    </g>
    <g transform="matrix(0.6903596,-0.7234664,0.7234664,0.6903596,63.683868,177.89531)">
      <circle cx="322.57" cy="144.01" r="7.54" fill="#F0E4C8" stroke="#3D5878" stroke-width="1.3"/>
      <path d="m 317.94781,138.07356 9.54465,11.40919" stroke="#3D5878" stroke-width="1" fill="none"/>
    </g>
    <g transform="matrix(0.00416913,0.99999131,-0.99999131,0.00416913,302.91468,-208.15311)">
      <circle cx="322.57" cy="144.01" r="7.54" fill="#F0E4C8" stroke="#3D5878" stroke-width="1.3"/>
      <path d="m 317.94781,138.07356 9.54465,11.40919" stroke="#3D5878" stroke-width="1" fill="none"/>
    </g>
  </g>

  <!-- ====== POPISKY (statické, sépie, sans-serif) ====== -->
  <style>
    .krok-popisek {
      font: 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 400;
      fill: #3A2818;
    }
    .krok-popisek-cislo {
      font: 600 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      fill: #3A2818;
    }
    .krok-popisek-mensi {
      font: 10px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      font-weight: 400;
      fill: #3A2818;
      opacity: 0.7;
    }
  </style>

  <!-- A — Krokové kolo (vlevo) -->
  <text x="6" y="378" class="krok-popisek-cislo">A</text>
  <text x="20" y="378" class="krok-popisek">— Krokové kolo (mosaz, 30 zubů)</text>

  <!-- B — Kotva (vlevo nahoře) -->
  <text x="6" y="50" class="krok-popisek-cislo">B</text>
  <text x="20" y="50" class="krok-popisek">— Kotva (ocel)</text>

  <!-- C — Palety (vpravo, u boků kotvy) -->
  <text x="350" y="220" class="krok-popisek-cislo">C</text>
  <text x="364" y="220" class="krok-popisek">— Palety</text>

  <!-- D — Tyč kyvadla (vpravo dole) -->
  <text x="290" y="560" class="krok-popisek-cislo">D</text>
  <text x="304" y="560" class="krok-popisek">— Tyč kyvadla</text>

  <!-- Spodní popis -->
  <text x="237.5" y="615" text-anchor="middle" class="krok-popisek-mensi">
    Grahamův klidový krok (G. Graham, 1715) — schematická animace
  </text>
</svg>
