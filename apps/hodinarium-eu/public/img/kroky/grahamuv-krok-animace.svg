<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grahamův klidový krok (deadbeat escapement) — schematická animace.

  Vznikla pro Hodinarium-eu / Český spolek horologický, 2026-05-26.
  Inspirováno: Chetvorno, "Graham Escapement" (Wikimedia Commons, Public Domain),
  https://commons.wikimedia.org/wiki/File:Graham_Escapement.svg
  Překresleno do jednotného stylu (viz docs/kroky-illustration-style.md):
  pastelová mosaz × ocelová modř × rubínové palety, sépiové obrysy,
  technické sans-serif popisky. Geometrie podle originálu (kotva nahoře,
  V-tvar otevřený dolů, kyvadlová tyč svisle dolů přes rovinu kola).

  License: CC BY 4.0 (Český spolek horologický)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 480"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Grahamův klidový krok — schematická animace</title>
  <desc id="desc">
    Krokové kolo (mosaz, 30 zubů) ve středu kontinuálně rotuje proti
    směru hodinových ručiček (1 zub/s). Kotva nahoře (ocel) pivotuje
    s amplitudou ±5°, rubínové palety na koncích ramen střídavě
    zachycují zuby kola. Kyvadlová tyč svisle dolů, mosazná čočka.
  </desc>

  <defs>
    <!-- 30zubé krokové kolo: tenké hákovité pily (deadbeat profil),
         self-centered v (0,0), poloměr ven 80, vnitřní disk 55 -->
    <g id="krokove-kolo">
      <!-- Vnitřní mosazný disk -->
      <circle cx="0" cy="0" r="55" fill="#E6C97A" stroke="#8A6E35" stroke-width="0.8"/>
      <!-- 30 zubů — tenké hákovité pily naklopené proti směru rotace (CCW).
           Každý zub: base 4 (od r=55), tip protažený nahoru na r=80,
           tip mírně nakloněný doprava (proti CCW rotaci = po směru ručiček). -->
      <g fill="#E6C97A" stroke="#8A6E35" stroke-width="0.7" stroke-linejoin="round">
        <polygon points="-2.2,-55 4,-80 2.2,-55"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(12)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(24)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(36)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(48)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(60)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(72)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(84)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(96)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(108)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(120)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(132)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(144)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(156)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(168)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(180)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(192)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(204)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(216)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(228)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(240)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(252)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(264)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(276)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(288)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(300)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(312)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(324)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(336)"/>
        <polygon points="-2.2,-55 4,-80 2.2,-55" transform="rotate(348)"/>
      </g>
      <!-- 4 paprsky -->
      <g stroke="#8A6E35" stroke-width="0.7" fill="none">
        <line x1="0" y1="-50" x2="0" y2="-14"/>
        <line x1="0" y1="50" x2="0" y2="14"/>
        <line x1="-50" y1="0" x2="-14" y2="0"/>
        <line x1="50" y1="0" x2="14" y2="0"/>
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="13" fill="#D4B760" stroke="#8A6E35" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#8A6E35"/>
    </g>

    <!-- Kotva s paletami: V-tvar otevřený dolů, pivot v (0,0),
         ramena směřují dolů a ven na ~30° od svislice, palety na koncích. -->
    <g id="kotva">
      <!-- Ramena kotvy (V otevřená dolů + vnitřní spodní hrana) -->
      <path d="
        M -55,80 L -3,3 L -3,-3 L 3,-3 L 3,3 L 55,80
        L 50,84 L 0,16 L -50,84 Z"
        fill="#88A8C8" stroke="#3D5878" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- Levá paleta (dosahá na pravý bok zubu kola) -->
      <g transform="translate(-52, 82) rotate(-38)">
        <rect x="-7" y="-3.5" width="14" height="7" rx="1" fill="#B85068" stroke="#8A3850" stroke-width="0.7"/>
        <line x1="-5" y1="-2.2" x2="-1" y2="-2.2" stroke="#F0C4D0" stroke-width="0.8" opacity="0.7"/>
      </g>
      <!-- Pravá paleta (dosahá na levý bok zubu kola) -->
      <g transform="translate(52, 82) rotate(38)">
        <rect x="-7" y="-3.5" width="14" height="7" rx="1" fill="#B85068" stroke="#8A3850" stroke-width="0.7"/>
        <line x1="-5" y1="-2.2" x2="-1" y2="-2.2" stroke="#F0C4D0" stroke-width="0.8" opacity="0.7"/>
      </g>
      <!-- Centrální pivot (s ocelovým očkem) -->
      <circle cx="0" cy="0" r="6" fill="#88A8C8" stroke="#3D5878" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#3D5878"/>
    </g>

    <style>
      .krok-popisek {
        font: 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 400;
        fill: #3A2818;
      }
      .krok-popisek-cislo {
        font: 600 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        fill: #3A2818;
      }
      .krok-popisek-mensi {
        font: 10px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 400;
        fill: #3A2818;
        opacity: 0.7;
      }
      .krok-leader {
        stroke: #6B4A2E;
        stroke-width: 0.5;
        stroke-dasharray: 2 1;
        fill: none;
      }
    </style>
  </defs>

  <!-- Pozadí (krémový papír) -->
  <rect x="0" y="0" width="480" height="480" fill="#F0E4C8"/>

  <!-- Kyvadlová tyč (svisle přes kolo — schematická abstrakce, v reálu za rovinou) -->
  <g class="kyvadlo" transform="translate(240, 80)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-5; 5; -5"
      keyTimes="0; 0.5; 1"
      dur="2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
      additive="sum"/>
    <!-- Kotva (V-tvar s paletami) -->
    <g transform="translate(-240, -80)">
      <use href="#kotva" x="240" y="80"/>
    </g>
    <!-- Tyč kyvadla -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#3D5878" stroke-width="1.4" opacity="0.5"/>
    <!-- Čočka kyvadla -->
    <circle cx="0" cy="360" r="14" fill="#D4B760" stroke="#8A6E35" stroke-width="1" opacity="0.85"/>
    <circle cx="0" cy="360" r="4.5" fill="#8A6E35" opacity="0.85"/>
    <line x1="-10" y1="357" x2="-3" y2="357" stroke="#F0E4C8" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Krokové kolo (kontinuální linear rotace CCW, 30 zubů × 12° = 360° za 30 s) -->
  <g transform="translate(240, 240)">
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0" to="-360"
        dur="30s"
        repeatCount="indefinite"/>
      <use href="#krokove-kolo"/>
    </g>
  </g>

  <!-- POPISKY s leader lines -->

  <!-- A — Krokové kolo (vlevo) -->
  <text x="14" y="240" class="krok-popisek-cislo">A</text>
  <text x="28" y="240" class="krok-popisek">— Krokové kolo (mosaz, 30 zubů)</text>
  <path d="M 22 236 Q 80 236 152 240" class="krok-leader"/>

  <!-- B — Kotva (nahoře) -->
  <text x="14" y="40" class="krok-popisek-cislo">B</text>
  <text x="28" y="40" class="krok-popisek">— Kotva (ocel)</text>
  <path d="M 22 36 Q 80 50 175 75" class="krok-leader"/>

  <!-- C — Palety (vpravo nahoře) -->
  <text x="340" y="170" class="krok-popisek-cislo">C</text>
  <text x="354" y="170" class="krok-popisek">— Palety (rubín)</text>
  <path d="M 337 166 Q 320 160 300 158" class="krok-leader"/>

  <!-- D — Tyč + čočka (vpravo dole) -->
  <text x="340" y="440" class="krok-popisek-cislo">D</text>
  <text x="354" y="440" class="krok-popisek">— Tyč kyvadla a čočka</text>
  <path d="M 337 436 Q 295 440 254 442" class="krok-leader"/>

  <!-- Spodní popis -->
  <text x="240" y="468" text-anchor="middle" class="krok-popisek-mensi">
    Grahamův klidový krok (G. Graham, 1715) — schematická animace
  </text>
</svg>
