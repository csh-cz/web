<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grahamův klidový krok (deadbeat escapement) — schematická animace.

  Vznikla pro Hodinarium-eu / Český spolek horologický, 2026-05-26.
  Inspirováno: Chetvorno, "Graham Escapement" (Wikimedia Commons, Public Domain),
  https://commons.wikimedia.org/wiki/File:Graham_Escapement.svg
  Překresleno do jednotného stylu (viz docs/kroky-illustration-style.md):
  pastelová mosaz × ocelová modř × rubínové palety, sépiové obrysy,
  technické sans-serif popisky.

  License: CC BY 4.0 (Český spolek horologický)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 380"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Grahamův klidový krok — schematická animace</title>
  <desc id="desc">
    Krokové kolo (mosaz, 30 zubů) v horní části poskakuje o jeden zub
    při každém extrému kyvu kyvadla. Kotva s rubínovými paletami (ocel)
    pivotuje pod kolem, dolní rameno přechází do kyvadla. Animace
    v reálném tempu 1 sekunda na kyv (2 sekundy plný cyklus).
  </desc>

  <defs>
    <!-- 30zubé krokové kolo (čitelné trojúhelníkové zuby) -->
    <g id="krokove-kolo">
      <!-- Vnější obrys s vyčnívajícími zuby (jeden path, 30 zubů × 12°) -->
      <path d="
        M 0,-70 L 3.95,-58.30
        L 9.06,-63.06 L 11.46,-50.78
        L 17.85,-56.18 L 19.06,-44.04
        L 26.21,-48.32 L 25.99,-36.34
        L 33.83,-39.34 L 32.10,-27.62
        L 40.42,-29.26 L 37.12,-18.05
        L 45.85,-18.32 L 41.00,-7.85
        L 50.00,-6.70 L 43.70,2.74
        L 52.78,5.10 L 45.16,13.20
        L 54.07,16.95 L 45.24,23.45
        L 53.78,28.49 L 43.86,33.13
        L 51.84,39.36 L 41.05,42.04
        L 48.31,49.34 L 36.85,49.93
        L 43.26,58.20 L 31.36,56.65
        L 36.79,65.79 L 24.66,62.06
        L 28.99,71.95 L 16.86,66.07
        L 19.97,76.59 L 8.07,68.65
        L 9.87,79.66 L -1.62,69.81
        L -1.62,80.95 L -12.54,69.43
        L -13.86,80.40 L -23.96,67.16
        L -26.49,77.85 L -35.62,63.18
        L -38.95,73.33 L -46.94,57.40
        L -50.93,67.04 L -57.60,50.00
        L -62.32,58.95 L -67.50,41.07
        L -72.78,49.34 L -76.40,30.81
        L -82.10,38.35 L -84.13,19.43
        L -90.00,26.34 L -90.31,7.21
        Z"
        fill="none" stroke="none"/>
      <!-- Mosazný disk s definovanými zuby — kompozit (polygon) -->
      <g fill="#E6C97A" stroke="#8A6E35" stroke-width="0.7" stroke-linejoin="round">
        <!-- Vnitřní disk -->
        <circle cx="0" cy="0" r="55"/>
        <!-- 30 zubů jako trojúhelníky -->
        <g class="zuby">
          <polygon points="0,-70 -4,-55 4,-55"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(12)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(24)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(36)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(48)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(60)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(72)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(84)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(96)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(108)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(120)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(132)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(144)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(156)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(168)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(180)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(192)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(204)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(216)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(228)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(240)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(252)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(264)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(276)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(288)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(300)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(312)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(324)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(336)"/>
          <polygon points="0,-70 -4,-55 4,-55" transform="rotate(348)"/>
        </g>
      </g>
      <!-- 4 paprsky -->
      <g stroke="#8A6E35" stroke-width="0.7" fill="none">
        <line x1="0" y1="-50" x2="0" y2="-12"/>
        <line x1="0" y1="50" x2="0" y2="12"/>
        <line x1="-50" y1="0" x2="-12" y2="0"/>
        <line x1="50" y1="0" x2="12" y2="0"/>
      </g>
      <!-- Hub (mosazný střed) -->
      <circle cx="0" cy="0" r="12" fill="#D4B760" stroke="#8A6E35" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="4" fill="#8A6E35"/>
    </g>

    <!-- Kotva s paletami: V-tvar otevřený dolů -->
    <g id="kotva">
      <!-- Ramena kotvy s pivotem dole -->
      <path d="
        M -38,-58 L -3,-3 L -3,3 L 3,3 L 3,-3 L 38,-58
        L 32,-62 L 0,-12 L -32,-62 Z"
        fill="#88A8C8" stroke="#3D5878" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- Vstupní paleta (vlevo, rubín) -->
      <g transform="translate(-35, -60) rotate(38)">
        <rect x="-6" y="-3.5" width="12" height="7" rx="1" fill="#B85068" stroke="#8A3850" stroke-width="0.6"/>
        <line x1="-4.5" y1="-2.2" x2="-1" y2="-2.2" stroke="#F0C4D0" stroke-width="0.7" opacity="0.7"/>
      </g>
      <!-- Výstupní paleta (vpravo, rubín) -->
      <g transform="translate(35, -60) rotate(-38)">
        <rect x="-6" y="-3.5" width="12" height="7" rx="1" fill="#B85068" stroke="#8A3850" stroke-width="0.6"/>
        <line x1="-4.5" y1="-2.2" x2="-1" y2="-2.2" stroke="#F0C4D0" stroke-width="0.7" opacity="0.7"/>
      </g>
      <!-- Centrální pivot -->
      <circle cx="0" cy="0" r="5" fill="#88A8C8" stroke="#3D5878" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#3D5878"/>
    </g>

    <!-- Kyvadlo (závěs + čočka) -->
    <g id="kyvadlo">
      <!-- Vidlice (krátká) -->
      <path d="M -4,0 L 0,3 L 4,0 L 4,7 L -4,7 Z" fill="#88A8C8" stroke="#3D5878" stroke-width="0.7"/>
      <!-- Tyč kyvadla -->
      <line x1="0" y1="7" x2="0" y2="62" stroke="#3D5878" stroke-width="1.3"/>
      <!-- Čočka (mosazný kruh) -->
      <circle cx="0" cy="74" r="12" fill="#D4B760" stroke="#8A6E35" stroke-width="0.9"/>
      <circle cx="0" cy="74" r="4" fill="#8A6E35"/>
      <line x1="-9" y1="71" x2="-3" y2="71" stroke="#F0E4C8" stroke-width="0.8" opacity="0.6"/>
    </g>

    <style>
      .krok-popisek {
        font: 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 400;
        fill: #3A2818;
      }
      .krok-popisek-cislo {
        font: 600 12px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        fill: #3A2818;
      }
      .krok-popisek-mensi {
        font: 10px/1.3 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        font-weight: 400;
        fill: #3A2818;
        opacity: 0.7;
      }
      .krok-leader {
        stroke: #6B4A2E;
        stroke-width: 0.5;
        stroke-dasharray: 2 1;
        fill: none;
      }
    </style>
  </defs>

  <!-- Pozadí (krémový papír) -->
  <rect x="0" y="0" width="480" height="380" fill="#F0E4C8"/>

  <!-- Krokové kolo (animovaná discrete rotace -12° každou sekundu) -->
  <g transform="translate(240, 130)">
    <use href="#krokove-kolo">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0" to="-12"
        dur="1s"
        repeatCount="indefinite"
        accumulate="sum"
        calcMode="discrete"/>
    </use>
  </g>

  <!-- Kotva + kyvadlo (oscilace ±5° kolem pivotu (240, 245)) -->
  <g transform="translate(240, 245)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-5; 5; -5"
      keyTimes="0; 0.5; 1"
      dur="2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
      additive="sum"/>
    <use href="#kotva"/>
    <g transform="translate(0, 8)">
      <use href="#kyvadlo"/>
    </g>
  </g>

  <!-- POPISKY s leader lines -->

  <!-- A — Krokové kolo (vlevo nahoře) -->
  <text x="14" y="36" class="krok-popisek-cislo">A</text>
  <text x="28" y="36" class="krok-popisek">— Krokové kolo (mosaz, 30 zubů)</text>
  <path d="M 22 32 Q 80 50 165 90" class="krok-leader"/>

  <!-- B — Kotva (vlevo dole) -->
  <text x="14" y="220" class="krok-popisek-cislo">B</text>
  <text x="28" y="220" class="krok-popisek">— Kotva (ocel)</text>
  <path d="M 22 216 Q 100 220 195 235" class="krok-leader"/>

  <!-- C — Palety (vpravo nahoře) -->
  <text x="330" y="220" class="krok-popisek-cislo">C</text>
  <text x="344" y="220" class="krok-popisek">— Palety (rubín)</text>
  <path d="M 327 216 Q 305 198 285 185" class="krok-leader"/>

  <!-- D — Závěs kyvadla (vpravo dole) -->
  <text x="330" y="320" class="krok-popisek-cislo">D</text>
  <text x="344" y="320" class="krok-popisek">— Tyč kyvadla a čočka</text>
  <path d="M 327 316 Q 290 320 254 325" class="krok-leader"/>

  <!-- Spodní popis schématu -->
  <text x="240" y="365" text-anchor="middle" class="krok-popisek-mensi">
    Grahamův klidový krok (G. Graham, 1715) — schematická animace, 1 s / kyv
  </text>
</svg>
