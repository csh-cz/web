4.65 -81.75 9.0 -83.45 -6.15 -85.05 -21.0 -81.25 M5.7 21.9 Q-0.05 23.4 -5.75 21.85 L-38.65 74.45 Q-24.6 81.75 -8.95 83.45 6.2 85.05 21.05 81.25 35.85 77.4 48.35 68.65 61.2 59.6 69.95 46.4 L15.7 16.35 Q11.4 20.45 5.7 21.9 M-83.4 -8.95 Q-85.05 6.2 -81.25 21.0 -77.4 35.8 -68.6 48.3 -59.55 61.15 -46.4 69.9 L-16.3 15.65 Q-20.4 11.4 -21.85 5.65 -23.35 -0.05 -21.85 -5.8 L-74.45 -38.65 Q-81.75 -24.6 -83.4 -8.95" fill="#ffcc00" stroke="#000" stroke-width="0.5"/>
      <path d="M0.05 -9.05 Q3.8 -9.05 6.45 -6.4 9.1 -3.75 9.1 0.0 9.1 3.75 6.45 6.4 3.8 9.05 0.05 9.05 -3.7 9.05 -6.4 6.4 -9.05 3.75 -9.05 0.0 -9.05 -3.75 -6.4 -6.4 -3.7 -9.05 0.05 -9.05" fill="#6666cc" stroke="#000" stroke-width="0.5"/>
