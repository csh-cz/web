# CSH spell-check slovník — auto-rebuild při změně obsahu.
#
# `csh-spell-dict.json` v `apps/hodinarium-eu/public/admin/` obsahuje
# whitelist jmen hodinářů, obcí, terminů a institucí, aby CSH spell-checker
# v editoru nepodtrhával hodinářskou specifika (jména, lokality, termíny).
#
# Slovník se generuje z:
#   - content/slovnik/**           (cs hesla)
#   - content/hodinari/**          (medailony osobností)
#   - apps/hodinarium-eu/src/data/hodinari.ts    (jmena + ASCII fold)
#   - content/soupis-veznich-hodin/**  (lokality + výrobci)
#
# Dříve se rebuildovalo ručně přes `pnpm spelldict:build` — pokud na to
# editor zapomněl po přidání nového hesla / medailonu, dict byl stale a
# nově přidaný hodinář se podtrhával červeně. Tato action to dělá auto.
#
# Trigger: push na main, který mění některý ze zdrojů (path filter níže).
# Output: commit "ci: rebuild spell-check dict [skip ci]" pokud se dict
# změnil; no-op pokud dict zůstal stejný (žádný empty commit).

name: Spell-check dict — rebuild

on:
  push:
    branches: [main]
    paths:
      - 'content/slovnik/**'
      - 'content/hodinari/**'
      - 'content/soupis-veznich-hodin/**'
      - 'apps/hodinarium-eu/src/data/hodinari.ts'
      - 'scripts/build-cs-spell-dictionary.mjs'
      - '.github/workflows/spell-dict-rebuild.yml'
  workflow_dispatch: {}

jobs:
  rebuild:
    name: Regenerate csh-spell-dict.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild dict
        run: pnpm spelldict:build

      - name: Commit rebuilt dict (if changed)
        run: |
          set -e
          DICT_PATH=apps/hodinarium-eu/public/admin/csh-spell-dict.json
          if git diff --quiet -- "$DICT_PATH"; then
            echo "Dict beze změny — žádný commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Word count pro commit message
          WORDS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$DICT_PATH')).words.length)")
          git add "$DICT_PATH"
          git commit -m "ci: rebuild spell-check dict ($WORDS words) [skip ci]

          Auto-rebuild po commit, který změnil:
          $(git diff --name-only HEAD~1 HEAD -- content/slovnik content/hodinari content/soupis-veznich-hodin apps/hodinarium-eu/src/data/hodinari.ts | sed 's/^/  - /')
          "
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "## CSH spell-check dict rebuild" >> "$GITHUB_STEP_SUMMARY"
          DICT_PATH=apps/hodinarium-eu/public/admin/csh-spell-dict.json
          if [ -f "$DICT_PATH" ]; then
            WORDS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$DICT_PATH')).words.length)")
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Words:** $WORDS" >> "$GITHUB_STEP_SUMMARY"
          fi
