# Pre-deploy content & build gate — D2.
#
# Účel: zachytit schema/content regrese PŘEDTÍM, než dorazí na Cloudflare
# Pages. Bez tohoto workflow padají buildy CF Pages tiše (deploy fail bez
# notifikace, live web zamrzne na poslední úspěšné nasazení).
#
# Historie incidentů které tento workflow adresuje:
#   - 2026-05-07 → 17  10 dní stuck deploy (build-cross-refs --strict
#                      selhával na 82 broken refs po D6 rename)
#   - 2026-05-18 03:18 pocetCifernik: null  (Sveltia CMS)
#   - 2026-05-18 04:35 workflow: null       (Sveltia CMS)
#   - 2026-05-18 13:30 globální sveltiaCleanNulls fix
#
# Triggery: každý push do main + manuální dispatch + pull_request.
# Spouští se POUZE pokud se měnily soubory co můžou ovlivnit build
# (content/, apps/*/src/, scripts/, package.json). Čistá editace
# docs/ nebo TODO.md neutrácí CI minuty.
#
# Trvání: ~3–5 min (sync ~30 s, astro check ~30 s, builds ~3 min total).
# Cloudflare Pages stejně nasazuje nezávisle — tento workflow je gate
# proti regresi, ne deploy mechanism.

name: Content + build validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/**'
      - 'apps/*/src/**'
      - 'apps/*/public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - '.github/workflows/content-validate.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'apps/*/src/**'
      - 'apps/*/public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - '.github/workflows/content-validate.yml'

# Jenom 1 běh per ref — pokud přijde další commit, předchozí běh zruš.
# Sveltia auto-commits přilétají v rychlém sledu (Save = commit), tohle
# šetří CI minuty.
concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-content + astro check + build (both apps)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) Cross-collection content validation (broken slugs, duplicate keys,
      #    legacy /clanky/ links). Rychlé (~5 s), spouští se i mimo CI přes
      #    `pnpm validate:content`.
      - name: Validate content (slugs, refs, frontmatter)
        run: pnpm validate:content

      # 2) Cross-refs strict mode — jako prebuild krok hodinarium-eu, ale
      #    extrahováno aby selhalo dříve než plný build (rychlejší feedback).
      - name: Cross-refs strict
        run: node scripts/build-cross-refs.mjs --strict

      # 3) Unit tests (D1 — 10 testů build-dictionary-index, Vitest 3.2.4).
      - name: Unit tests
        run: pnpm test:unit

      # 3b) Content style audits — preventivně chytí regrese stylistické
      #    konvence ZAVEDENÉ v posledních batches (2026-05-19):
      #      - [Zotero KEY] mentions v body  → strip-zotero-keys
      #      - tldr markdown artefakty       → strip-tldr-markdown
      #      - OCR drop-cap **X**y           → strip-ocr-drop-caps
      #    Všechny tři skripty jsou idempotent — pokud něco najdou, znamená
      #    to že editor pushuje regression a workflow padne.
      #    Skripty NIC neopravují (žádný --apply), jen audit + non-zero exit.
      - name: Audit citation style (no [Zotero KEY] in body)
        run: |
          OUTPUT=$(grep -rE "\[Zotero\s+\`" content/ 2>/dev/null || true)
          if [ -n "$OUTPUT" ]; then
            echo "::error::Body contains [Zotero KEY] mentions — must be in references[].zoteroKey (skrytý field):"
            echo "$OUTPUT" | head -10
            exit 1
          fi
          echo "✓ 0 [Zotero KEY] mentions in body"

      # `--no-warnings` zabíjí Node `ExperimentalWarning: glob is an experimental
      # feature` ze stderr — bez něj se warning řádky pomíchají do regex parsingu
      # a "Touched: N" hodnota se rozbije podle Node minor verze (fail
      # 47e38c4a). `|| true` chytá případný non-zero exit z node (script jinak
      # exit 0 i pro found content, počítáme value z stdout).
      - name: Audit tldr markdown (must be plaintext)
        run: |
          OUTPUT=$(node --no-warnings scripts/strip-tldr-markdown.mjs 2>&1 || true)
          TOUCHED=$(echo "$OUTPUT" | grep -oE "Touched: [0-9]+" | head -1 | grep -oE "[0-9]+")
          TOUCHED=${TOUCHED:-MISSING}
          if [ "$TOUCHED" = "MISSING" ]; then
            echo "::error::Audit script nevypsal 'Touched: N' marker — zkontroluj scripts/strip-tldr-markdown.mjs"
            echo "$OUTPUT"
            exit 1
          fi
          if [ "$TOUCHED" != "0" ]; then
            echo "::error::tldr fields contain markdown artefakty — run \`node scripts/strip-tldr-markdown.mjs --apply\`:"
            echo "$OUTPUT" | head -20
            exit 1
          fi
          echo "✓ tldr fields are plaintext"

      - name: Audit OCR drop-caps (no **X**y patterns)
        run: |
          OUTPUT=$(node --no-warnings scripts/strip-ocr-drop-caps.mjs 2>&1 || true)
          STRIPPED=$(echo "$OUTPUT" | grep -oE "Pattern A stripped:[[:space:]]+[0-9]+" | head -1 | grep -oE "[0-9]+$")
          STRIPPED=${STRIPPED:-MISSING}
          if [ "$STRIPPED" = "MISSING" ]; then
            echo "::error::Audit script nevypsal 'Pattern A stripped: N' marker — zkontroluj scripts/strip-ocr-drop-caps.mjs"
            echo "$OUTPUT"
            exit 1
          fi
          if [ "$STRIPPED" != "0" ]; then
            echo "::error::Body contains OCR drop-cap **X**y artefakty — run \`node scripts/strip-ocr-drop-caps.mjs --apply\`:"
            echo "$OUTPUT" | head -25
            exit 1
          fi
          echo "✓ 0 OCR drop-cap artefakty"

      # 4) Astro check (TypeScript + content collection schemas). Tohle je
      #    kritický krok — chytí Sveltia null bugs typu „workflow: null"
      #    DŘÍVE než CF Pages tichý fail. Po fixu sveltiaCleanNulls
      #    (commit f3301c3a) by null hodnoty měly procházet sanitizer-em.
      - name: Astro check (hodinarium-eu)
        run: pnpm --filter hodinarium-eu astro check

      - name: Astro check (horologie-cz)
        run: pnpm --filter horologie-cz astro check

      # 5) Plný build hodinarium-eu (větší + kritičtější collection). Chytí
      #    runtime fails co astro check nezachytí (MDX render errors, missing
      #    imgs, broken includes). Build trvá v CI ~8–10 min na cold cache.
      #
      #    horologie-cz build se přeskakuje — kolekce je menší (~20 souborů),
      #    riziko MDX runtime fail je minimální, a oba apps sdílí schema +
      #    většinu Astro infra → hodinarium-eu build pokryje regrese pro oba.
      #    Pokud bude potřeba, můžeme přidat samostatným workflow per app.
      - name: Build hodinarium-eu
        run: pnpm --filter hodinarium-eu build
        env:
          # Skip image variant generation (sharp processing 2700+ files
          # trvá 10+ min, není potřeba pro D2 schema/build validation —
          # plný regen běží přes imgvariants-r2-sync.yml).
          SKIP_IMG_GEN: '1'
          # Skipnout R2 upload step v prebuild (nemáme R2 secrets v této akci)
          SKIP_R2_UPLOAD: 'true'

      # 6) Status summary do GH Actions report — užitečné když se podívá
      #    někdo třetí na workflow run.
      - name: Summary on failure
        if: failure()
        run: |
          echo "## ⚠️ Content/build validation selhalo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CF Pages deploy bude tichoščasně stuck** dokud se tento push neopraví." >> $GITHUB_STEP_SUMMARY
          echo "Typické příčiny:" >> $GITHUB_STEP_SUMMARY
          echo "- Sveltia CMS zapsala \`null\` do YAML pro pole, které schema očekává jako \`T | undefined\`. Fix: globální \`sveltiaCleanNulls\` v \`content.config.ts\` to řeší pro většinu polí; pokud se objeví nové pole, viz \`portretSource\` jako vzor per-field preprocess." >> $GITHUB_STEP_SUMMARY
          echo "- Broken cross-ref: odkaz na slug, který neexistuje. Fix: oprava slugu nebo přidání entry do collection." >> $GITHUB_STEP_SUMMARY
          echo "- TS chyba v Astro source. Fix: \`pnpm --filter hodinarium-eu astro check\` lokálně, oprava, push." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Po opravě: \`git push origin main\` → tento workflow projde → CF Pages se odblokuje." >> $GITHUB_STEP_SUMMARY

      - name: Summary on success
        if: success()
        run: |
          echo "## ✓ Content + build validation passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Schema/content/build jsou clean — CF Pages deploy by měl projít bez problémů." >> $GITHUB_STEP_SUMMARY
