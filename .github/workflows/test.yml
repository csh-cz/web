# Volitelný CI gate — Playwright regresní testy proti deployovaným pages.dev.
#
# Spouští se ručně (workflow_dispatch) nebo po pushi do main (s paths-ignore
# pro non-UI změny). Cloudflare Pages deploy jede mimo GitHub Actions přes
# Pages CI, takže tento workflow je čistě smoke regression — nic neblokuje.
#
# Úsporné nastavení:
#   - Trigger jen `main` (feature větve agenta = 0 minut)
#   - Concurrency group s cancel-in-progress: rychlý sled commitů na main
#     zruší staré běhy a nechá doběhnout jen nejnovější
#   - Široký paths-ignore: data-only edity (content/*.md, semantic-index,
#     scripts/, tmp/, docs/, README) testy nespouští
#
# Pokud nechceš CI mít zapnutý, smaž tenhle soubor — všechny scripty
# (pnpm test:e2e) fungují i lokálně.

name: UI tests (Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # Markdown / docs — neovlivňují UI build
      - '**.md'
      - '**.mdx'
      - 'BUGS.md'
      - 'TODO.md'
      - 'docs/**'
      # Content edity (články, karty, medailony, soupis, kronika) — change
      # data, ne UI logiku. Jejich render testujeme manuálně přes preview.
      - 'content/**'
      # Semantic search index — rebuild po každé změně textu, 5 MB blob,
      # neovlivňuje UI (jen vrácená data v /api/search/semantic response)
      - 'apps/*/public/search/**'
      # Build/sync skripty mimo aplikační kód
      - 'scripts/**'
      # Pracovní soubory mimo runtime
      - 'tmp/**'
      - 'local/**'
      - 'raw/**'
      - 'zdroje/**'
      # GitHub config sám sebe netriggeruje
      - '.github/**'

# Auto-cancel staré běhy při novém pushi na main. Šetří minuty když
# agent commitne víckrát za sebou — místo 5 paralelních runů (~50 min)
# poběží jen nejnovější (~10 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Smoke + regression na pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for Cloudflare Pages deploy to settle
        # Cloudflare Pages dokončí nasazení krátce po pushi.
        # 30 s buffer minimalizuje race s předchozím commitem.
        run: sleep 30

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
