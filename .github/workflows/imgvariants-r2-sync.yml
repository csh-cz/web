# Image sourcing → R2 (off-git storage).
#
# Trigger: push na main, který zahrnuje nový/změněný JPG/PNG v apps/*/public/img/.
# Workflow:
#   1) Vygeneruje AVIF/WebP varianty (sharp) jen pro změněné zdroje
#   2) Uploadne varianty + originál na R2 bucket `csh-imgvariants`
#   3) Smaže originál z gitu (post-upload commit "ci: move to R2") —
#      JPG/PNG už dlouhodobě nezůstávají v repo, jen na R2.
#
# Petr nahraje fotku přes Sveltia → csh-cms-proxy commit do main →
# tato Action běží ~1 min → druhý commit smaže JPG z repa → CF Pages
# rebuild → browser dostává AVIF + JPG fallback z R2.
#
# Manual trigger (workflow_dispatch): plný regen — projde všech 2867 zdrojů
# a vygeneruje chybějící varianty. Užitečné pro recovery (např. po R2 wipe)
# nebo když se změní konverzní parametry (quality, effort).
#
# Secrets potřebné v repo settings → Secrets and variables → Actions:
#   - R2_ACCOUNT_ID         (Cloudflare Account ID)
#   - R2_ACCESS_KEY_ID      (R2 Object Read & Write token, Access Key ID)
#   - R2_SECRET_ACCESS_KEY  (R2 Object Read & Write token, Secret)

name: Image variants → R2 sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/public/img/**/*.jpg'
      - 'apps/*/public/img/**/*.jpeg'
      - 'apps/*/public/img/**/*.png'
      - 'scripts/generate-image-formats.ts'
      - 'scripts/upload-imgvariants-to-r2.mjs'
      - '.github/workflows/imgvariants-r2-sync.yml'
  workflow_dispatch:
    inputs:
      full_regen:
        description: 'Plný regen všech variantů (jinak diff z posledního pushe)'
        type: boolean
        default: false
      backfill_metadata:
        description: 'Metadata backfill — stáhne varianty z R2, embedne licenci (--force), re-uploadne (BEZ regenerace variant)'
        type: boolean
        default: false

jobs:
  sync:
    name: Generate AVIF/WebP + upload to R2 + remove sources from git
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Pro git rm + push commit zpět na main musíme mít write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # potřebujeme HEAD^ pro git diff
          persist-credentials: true  # umožní git push z workflow

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install exiftool (XMP/IPTC licence embed)
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Detect changed raster sources
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill_metadata }}" = "true" ]; then
            echo "mode=meta" >> "$GITHUB_OUTPUT"
            echo "Metadata backfill requested (download variants from R2 + embed + re-upload)."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_regen }}" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Manual full regen requested."
          else
            # diff vs předchozí commit; filtruj na JPG/PNG v public/img/.
            # Pozor: git pathspec `**` se chová jinak než gitignore globs
            # (`*` v pathspecu neexpanduje přes /). Proto grep regex.
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
              | grep -E '^apps/[^/]+/public/img/.*\.(jpg|jpeg|png)$' \
              | tr '\n' ',' | sed 's/,$//' || true)
            if [ -z "$CHANGED" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "Žádný JPG/PNG nezměněn v tomto pushi."
            else
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
              echo "Změnily se tyto fotky:"
              echo "$CHANGED" | tr ',' '\n'
            fi
          fi

      - name: Generate variants (diff)
        if: steps.changed.outputs.mode == 'diff'
        run: pnpm imgvariants:build -- --files "${{ steps.changed.outputs.files }}"

      - name: Generate variants (full regen)
        if: steps.changed.outputs.mode == 'full'
        run: pnpm imgvariants:build

      # Metadata backfill: varianty nejsou v gitu (jen na R2), regenerace je moc
      # pomalá → stáhneme je z R2 vedle originálů, ať je embed může orazítkovat.
      - name: Download variants from R2 (metadata backfill)
        if: steps.changed.outputs.mode == 'meta'
        run: pnpm imgvariants:download
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: csh-imgvariants

      # Embed plné licence/atribuce (XMP+IPTC) do originálu i variant PŘED
      # uploadem — soubor na R2 musí být self-describing i mimo web (kde
      # neplatí site-wide default CC BY 4.0). Viz skill obrazky §6.1.1.
      - name: Embed licence metadata (diff)
        if: steps.changed.outputs.mode == 'diff'
        run: node scripts/write-xmp-metadata.mjs --force --files "${{ steps.changed.outputs.files }}"

      - name: Embed licence metadata (full regen / metadata backfill)
        if: steps.changed.outputs.mode == 'full' || steps.changed.outputs.mode == 'meta'
        run: node scripts/write-xmp-metadata.mjs --force

      - name: Upload variants + sources to R2
        if: steps.changed.outputs.mode != 'none'
        run: pnpm imgvariants:upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: csh-imgvariants

      - name: Remove source JPG/PNG from git (now on R2)
        if: steps.changed.outputs.mode == 'diff'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rozparsuj comma-separated seznam změněných zdrojů a smaž je
          IFS=',' read -ra FILES <<< "${{ steps.changed.outputs.files }}"
          for f in "${FILES[@]}"; do
            git rm "$f"
          done
          git commit -m "ci: move uploaded images to R2 [skip ci]

          Source files uploaded by Sveltia editor have been pushed to the
          R2 bucket (csh-imgvariants). They no longer need to live in the
          git repo — fallback <img src> in the rendered <picture> points
          to R2 directly via rehype-picture cdnBase config.

          Files moved:
          $(printf '  - %s\n' "${FILES[@]}")"
          # Pull-rebase před push pro případ, kdyby mezi tím spadl jiný commit
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "## Image variants → R2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: \`${{ steps.changed.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changed.outputs.mode }}" = "diff" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Files:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.changed.outputs.files }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
