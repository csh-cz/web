# AVIF/WebP varianty pro nové fotky → R2.
#
# Trigger: push na main, který zahrnuje nový/změněný JPG/PNG v apps/*/public/img/.
# Workflow zjistí změněné zdroje, vygeneruje varianty jen pro ně (sharp)
# a nahraje je do R2 bucketu `csh-imgvariants` (idempotentně).
#
# Petr nahraje fotku přes Sveltia CMS → csh-cms-proxy commit do main →
# tato Action běží ~2-3 min → CF Pages mezitím dokončí build →
# browser dostane AVIF z R2.
#
# Manual trigger (workflow_dispatch): plný regen — projde všech 2867 zdrojů
# a vygeneruje chybějící varianty. Užitečné pro recovery (např. po R2 wipe)
# nebo když se změní konverzní parametry (quality, effort).
#
# Secrets potřebné v repo settings → Secrets and variables → Actions:
#   - R2_ACCOUNT_ID         (Cloudflare Account ID)
#   - R2_ACCESS_KEY_ID      (R2 Object Read & Write token, Access Key ID)
#   - R2_SECRET_ACCESS_KEY  (R2 Object Read & Write token, Secret)

name: Image variants → R2 sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/public/img/**/*.jpg'
      - 'apps/*/public/img/**/*.jpeg'
      - 'apps/*/public/img/**/*.png'
      - 'scripts/generate-image-formats.ts'
      - 'scripts/upload-imgvariants-to-r2.mjs'
      - '.github/workflows/imgvariants-r2-sync.yml'
  workflow_dispatch:
    inputs:
      full_regen:
        description: 'Plný regen všech variantů (jinak diff z posledního pushe)'
        type: boolean
        default: false

jobs:
  sync:
    name: Generate AVIF/WebP + upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # potřebujeme HEAD^ pro git diff

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changed raster sources
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_regen }}" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Manual full regen requested."
          else
            # diff vs předchozí commit; filtruj na JPG/PNG v public/img/.
            # Pozor: git pathspec `**` se chová jinak než gitignore globs
            # (`*` v pathspecu neexpanduje přes /). Proto grep regex.
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
              | grep -E '^apps/[^/]+/public/img/.*\.(jpg|jpeg|png)$' \
              | tr '\n' ',' | sed 's/,$//' || true)
            if [ -z "$CHANGED" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "Žádný JPG/PNG nezměněn v tomto pushi."
            else
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
              echo "Změnily se tyto fotky:"
              echo "$CHANGED" | tr ',' '\n'
            fi
          fi

      - name: Generate variants (diff)
        if: steps.changed.outputs.mode == 'diff'
        run: pnpm imgvariants:build -- --files "${{ steps.changed.outputs.files }}"

      - name: Generate variants (full regen)
        if: steps.changed.outputs.mode == 'full'
        run: pnpm imgvariants:build

      - name: Upload variants to R2
        if: steps.changed.outputs.mode != 'none'
        run: pnpm imgvariants:upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: csh-imgvariants

      - name: Summary
        if: always()
        run: |
          echo "## Image variants → R2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: \`${{ steps.changed.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changed.outputs.mode }}" = "diff" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Files:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.changed.outputs.files }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
