# Weekly dead-link audit napříč content/ — najde mrtvé externí URL,
# pošle dotaz na Wayback Machine pro nejbližší snapshot, vygeneruje
# report. Pokud novej dead link, vytvoří nebo aktualizuje GitHub Issue.
#
# Spouští se každou neděli ráno 04:00 UTC. Manual trigger přes
# workflow_dispatch — pro debug nebo on-demand check.

name: Dead-link audit (weekly)

on:
  workflow_dispatch:
  schedule:
    # Neděle 04:00 UTC (= 05:00 CET / 06:00 CEST). Pages CI v té době
    # ne-aktivní → žádné race s deploy.
    - cron: '0 4 * * 0'

jobs:
  audit:
    name: Skenovat content/ a aktualizovat report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # commit aktualizovaného reportu
      issues: write         # create/update GitHub Issue se shrnutím

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # audit-dead-links.mjs jen Node std lib + yaml (přes lazy import).
      # yaml je již v devDependencies, takže pnpm install OK; pro malou
      # rychlost lze i samostatně `npm install yaml` (~5 s).
      - name: Install yaml dep
        run: npm install yaml

      - name: Run dead-link audit
        run: node scripts/audit-dead-links.mjs

      - name: Commit aktualizovaný report
        id: commit_report
        run: |
          git config user.name 'csh-bot'
          git config user.email 'noreply@orloj.eu'
          # Smazat staré dated reporty starší 30 dní (drží jen aktuální + 4 týdny historie)
          find docs -name 'dead-links-audit-*.md' -mtime +30 -delete 2>/dev/null || true
          # POZN.: raw JSON jde do tmp/ (gitignored, viz .gitignore) — jen lokální
          # debug, NEcommitovat (jinak `git add` na ignored path failne celý krok).
          # Marker (src/data/dead-links.json) + editor index zůstávají review-gated
          # (commitují se ručně po kontrole), workflow publikuje jen report + Issue.
          git add docs/dead-links-audit-*.md
          if git diff --cached --quiet; then
            echo "Žádné změny v reportu (= žádné nové dead links)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(deadlinks): weekly audit ${DATE}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Aktualizovat / vytvořit GitHub Issue
        # I když se report nezměnil (= existující stav nepřibyl), pořád
        # aktualizujeme issue (timestamp + signál „audit běžel"). Pokud
        # by issue chyběl, vytvoříme nový — i kdyby dead count byl 0.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          LATEST=$(ls -t docs/dead-links-audit-*.md 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "Žádný audit report — issue nezakládáme."
            exit 0
          fi

          DATE=$(basename "$LATEST" .md | sed 's/dead-links-audit-//')
          # Parsování shrnutí z markdown reportu (formát stabilní z audit-dead-links.mjs)
          DEAD=$(grep -oE 'Mrtvé / nedostupné:\*\* [0-9]+' "$LATEST" | grep -oE '[0-9]+' | head -1 || echo 0)
          TOTAL=$(grep -oE 'Unikátních URL:\*\* [0-9]+' "$LATEST" | grep -oE '[0-9]+' | head -1 || echo 0)
          WBM=$(grep -oE 'Wayback Machine snapshotem:\*\* [0-9]+' "$LATEST" | grep -oE '[0-9]+' | head -1 || echo 0)
          FILES=$(grep -oE 'unikátních URL ve [0-9]+ souborech' "$LATEST" | grep -oE '[0-9]+' | head -1 || echo 0)

          TITLE="Dead-link audit: ${DEAD} mrtvých odkazů (${DATE})"
          BODY=$(cat <<EOF
          **Týdenní automatický audit externích odkazů — ${DATE}**

          | Metrika | Hodnota |
          |---|---|
          | Skenované unikátní URL | ${TOTAL} |
          | Mrtvé / nedostupné (4xx/5xx) | **${DEAD}** |
          | Dotčené soubory | ${FILES} |
          | S Wayback snapshotem | ${WBM} |

          📄 Plný report: [\`docs/dead-links-audit-${DATE}.md\`](../blob/main/docs/dead-links-audit-${DATE}.md)

          ## Co s tím

          Pro každý dead link v reportu rozhodněte:

          - **REPLACE → Wayback** — nahradit URL za snapshot z Web Archive (pokud existuje a obsah je zachován)
          - **REPLACE → ekvivalent** — najít aktuální zdroj se stejným obsahem
          - **REMOVE** — odstranit odkaz (jeho obsah už není relevantní)

          Po opravě spusťte \`pnpm deadlinks:audit\` lokálně, ověřte report a commitněte úpravy v \`content/\`. Tento issue se automaticky aktualizuje při příštím týdenním runu (neděle 04:00 UTC).

          ---

          🤖 Generováno [dead-links-weekly.yml](../blob/main/.github/workflows/dead-links-weekly.yml) ve workflow runu [#${{ github.run_number }}](../actions/runs/${{ github.run_id }}).
          EOF
          )

          # Pokud existuje open issue s labelem dead-links, edit; jinak create.
          EXISTING=$(gh issue list --label dead-links --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Aktualizace issue #${EXISTING}…"
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            echo "Vytváření nového issue…"
            gh issue create --label dead-links --title "$TITLE" --body "$BODY"
          fi
