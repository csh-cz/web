name = "csh-cms-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Secrets (nastavit přes `wrangler secret put`):
#   GITHUB_BOT_PAT       — fine-grained PAT cshbot s contents:write na csh-cz/web
#   ALLOWED_ORIGINS      — JSON array povolených origins (CMS UI), např.
#                          ["https://hodinarium-eu.pages.dev","https://hodinarium.eu"]
#
# Vars (public, v tomto souboru):
[vars]
GITHUB_REPO = "csh-cz/web"
GITHUB_DEFAULT_BRANCH = "main"
BOT_AUTHOR_NAME = "cshbot"
BOT_AUTHOR_EMAIL = "cshbot@users.noreply.github.com"
